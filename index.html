<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Games</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#111;
}

.screen{
    position:absolute;
    inset:0;
    display:none;
}

.screen.active{
    display:block;
}

button{
    border:0;
    border-radius:12px;
    padding:15px 25px;
    font-size:20px;
    cursor:pointer;
    background:#fff;
    color:#111;
    margin:8px;
}

button:active{
    transform:scale(.95);
}

/* HOME */

#home{
    background:linear-gradient(#182848,#4b6cb7);
    color:white;
    text-align:center;
    padding-top:12vh;
}

#home h1{
    font-size:48px;
    margin-bottom:15px;
}

#home p{
    font-size:20px;
    margin-bottom:35px;
}

.gameButton{
    display:block;
    width:min(400px,85%);
    margin:15px auto;
    font-size:24px;
    font-weight:bold;
}

#raceButton{
    background:#e53935;
    color:white;
}

#geoButton{
    background:#7e57c2;
    color:white;
}

#mineButton{
    background:#43a047;
    color:white;
}

/* COMMON GAME UI */

.homeBtn{
    position:absolute;
    top:10px;
    right:10px;
    z-index:100;
    font-size:16px;
    padding:10px 15px;
}

#race{
    background:#222;
}

#raceCanvas{
    display:block;
    margin:auto;
    background:#555;
}

/* RACING */

#raceMenu{
    position:absolute;
    inset:0;
    z-index:20;
    background:#111;
    color:white;
    text-align:center;
    padding-top:12vh;
}

#raceMenu h1{
    font-size:42px;
    margin-bottom:30px;
}

.raceLevel{
    width:250px;
    display:block;
    margin:12px auto;
    color:white;
}

.easy{background:#388e3c}
.medium{background:#f57c00}
.hard{background:#d32f2f}

#raceHUD{
    position:absolute;
    top:10px;
    left:10px;
    z-index:10;
    color:white;
    background:rgba(0,0,0,.5);
    padding:10px;
    border-radius:8px;
    font-size:18px;
}

#racePause{
    position:absolute;
    top:10px;
    right:100px;
    z-index:10;
    padding:8px 12px;
    font-size:15px;
}

#crashScreen{
    position:absolute;
    inset:0;
    z-index:30;
    background:rgba(0,0,0,.75);
    color:white;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
}

#crashScreen h1{
    font-size:60px;
    color:#ff3333;
}

#crashScreen p{
    font-size:24px;
}

/* GEOMETRY DASH */

#geo{
    background:#111;
}

#geoCanvas{
    width:100%;
    height:100%;
    display:block;
}

#geoMenu{
    position:absolute;
    inset:0;
    background:#191919;
    color:white;
    text-align:center;
    padding-top:7vh;
    z-index:30;
    overflow:auto;
}

#geoMenu h1{
    font-size:45px;
    color:#00e5ff;
}

.levelGrid{
    width:min(700px,95%);
    margin:25px auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.levelButton{
    margin:0;
    padding:14px 5px;
    font-size:18px;
    background:#00bcd4;
    color:white;
}

#geoHUD{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    background:rgba(0,0,0,.45);
    padding:8px;
    border-radius:8px;
    z-index:10;
}

#geoPause{
    position:absolute;
    top:10px;
    right:100px;
    z-index:10;
    font-size:14px;
    padding:8px;
}

/* MINECRAFT */

#mine{
    background:#87ceeb;
}

#mineCanvas{
    position:absolute;
    inset:0;
}

#mineHUD{
    position:absolute;
    top:10px;
    left:10px;
    z-index:20;
    color:white;
    background:rgba(0,0,0,.45);
    padding:10px;
    border-radius:8px;
    line-height:1.5;
}

#mineCrosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:25px;
    height:25px;
    transform:translate(-50%,-50%);
    z-index:15;
    pointer-events:none;
}

#mineCrosshair:before,
#mineCrosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 3px black;
}

#mineCrosshair:before{
    width:2px;
    height:25px;
    left:12px;
}

#mineCrosshair:after{
    width:25px;
    height:2px;
    top:12px;
}

.mineControls{
    position:absolute;
    inset:0;
    z-index:25;
    pointer-events:none;
}

.mineBtn{
    position:absolute;
    width:62px;
    height:62px;
    padding:0;
    margin:0;
    border-radius:15px;
    background:rgba(0,0,0,.4);
    color:white;
    border:2px solid rgba(255,255,255,.6);
    pointer-events:auto;
    font-size:25px;
}

#mw{
    left:78px;
    bottom:140px;
}

#ms{
    left:78px;
    bottom:10px;
}

#ma{
    left:8px;
    bottom:75px;
}

#md{
    left:148px;
    bottom:75px;
}

#mj{
    right:20px;
    bottom:135px;
}

#mbreak{
    right:95px;
    bottom:55px;
}

#mplace{
    right:20px;
    bottom:55px;
}

#mineHint{
    position:absolute;
    right:10px;
    top:70px;
    color:white;
    background:rgba(0,0,0,.4);
    padding:8px;
    border-radius:8px;
    font-size:12px;
}

@media(min-width:800px){
    .mineControls{
        display:none;
    }
}

@media(max-width:600px){
    #home h1{
        font-size:38px;
    }

    #home p{
        font-size:16px;
    }

    .levelGrid{
        grid-template-columns:repeat(5,1fr);
    }

    .levelButton{
        font-size:14px;
        padding:11px 2px;
    }
}
</style>
</head>

<body>

<!-- ================= HOME ================= -->

<div id="home" class="screen active">

    <h1>🎮 MY GAMES</h1>
    <p>Choose a game</p>

    <button class="gameButton" id="raceButton">
        🏎️ Racing Game
    </button>

    <button class="gameButton" id="geoButton">
        🟦 Geometry Dash
    </button>

    <button class="gameButton" id="mineButton">
        ⛏️ Minecraft
    </button>

</div>


<!-- ================= RACING ================= -->

<div id="race" class="screen">

    <button class="homeBtn" id="raceHome">🏠 Home</button>

    <div id="raceMenu">

        <h1>🏎️ RACING GAME</h1>

        <button class="raceLevel easy" data-level="easy">
            EASY
        </button>

        <button class="raceLevel medium" data-level="medium">
            MEDIUM
        </button>

        <button class="raceLevel hard" data-level="hard">
            HARD
        </button>

    </div>

    <div id="raceHUD">
        TIME: <span id="raceTime">0</span>s
        &nbsp;&nbsp;
        SCORE: <span id="raceScore">0</span>
    </div>

    <button id="racePause">PAUSE</button>

    <canvas id="raceCanvas" width="600" height="700"></canvas>

    <div id="crashScreen">

        <h1>💥 CRASH!</h1>

        <p>
            Score: <span id="finalScore">0</span>
        </p>

        <button id="raceAgain">PLAY AGAIN</button>
        <button id="raceMenuBtn">MENU</button>

    </div>

</div>


<!-- ================= GEOMETRY DASH ================= -->

<div id="geo" class="screen">

    <button class="homeBtn" id="geoHome">🏠 Home</button>

    <div id="geoMenu">

        <h1>🟦 GEOMETRY DASH</h1>

        <p style="margin-top:10px">
            Choose a level
        </p>

        <div class="levelGrid" id="levelGrid"></div>

    </div>

    <div id="geoHUD">
        LEVEL: <span id="geoLevel">1</span>
    </div>

    <button id="geoPause">PAUSE</button>

    <canvas id="geoCanvas"></canvas>

</div>


<!-- ================= MINECRAFT ================= -->

<div id="mine" class="screen">

    <button class="homeBtn" id="mineHome">
        🏠 Home
    </button>

    <canvas id="mineCanvas"></canvas>

    <div id="mineCrosshair"></div>

    <div id="mineHUD">
        ⛏️ MINECRAFT
        <br>
        Block:
        <span id="selectedBlock">Grass</span>
        <br>
        1 Grass | 2 Dirt | 3 Stone | 4 Wood | 5 Leaves
    </div>

    <div id="mineHint">
        PC: WASD + mouse<br>
        Phone: buttons + drag
    </div>

    <div class="mineControls">

        <button class="mineBtn" id="mw">▲</button>
        <button class="mineBtn" id="ms">▼</button>
        <button class="mineBtn" id="ma">◀</button>
        <button class="mineBtn" id="md">▶</button>

        <button class="mineBtn" id="mj">↑</button>

        <button class="mineBtn" id="mbreak">⛏</button>
        <button class="mineBtn" id="mplace">▣</button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   GENERAL SCREEN SYSTEM
========================================================= */

const screens = {
    home: document.getElementById("home"),
    race: document.getElementById("race"),
    geo: document.getElementById("geo"),
    mine: document.getElementById("mine")
};

function showScreen(name){

    Object.values(screens).forEach(s =>
        s.classList.remove("active")
    );

    screens[name].classList.add("active");

    if(name !== "race"){
        stopRace();
    }

    if(name !== "geo"){
        stopGeometry();
    }

    if(name !== "mine"){
        stopMinecraft();
    }
}

document.getElementById("raceButton")
    .onclick = () => {
        showScreen("race");
        raceMenu.style.display = "block";
    };

document.getElementById("geoButton")
    .onclick = () => {
        showScreen("geo");
        geoMenu.style.display = "block";
    };

document.getElementById("mineButton")
    .onclick = () => {
        showScreen("mine");
        startMinecraft();
    };

document.getElementById("raceHome")
    .onclick = () => showScreen("home");

document.getElementById("geoHome")
    .onclick = () => showScreen("home");

document.getElementById("mineHome")
    .onclick = () => showScreen("home");


/* =========================================================
   RACING GAME
========================================================= */

const raceCanvas =
    document.getElementById("raceCanvas");

const rctx =
    raceCanvas.getContext("2d");

const raceMenu =
    document.getElementById("raceMenu");

const crashScreen =
    document.getElementById("crashScreen");

let raceRunning = false;
let racePaused = false;
let raceLevel = "easy";

let racePlayer;
let raceEnemies = [];

let raceStartTime = 0;
let raceLastTime = 0;
let raceAnimation;

let raceKeys = {};

let raceSpawnTimer = 0;

const raceSettings = {
    easy:{
        speed:220,
        enemySpeed:150,
        maxEnemies:2
    },
    medium:{
        speed:260,
        enemySpeed:190,
        maxEnemies:3
    },
    hard:{
        speed:300,
        enemySpeed:250,
        maxEnemies:4
    }
};

document.querySelectorAll(".raceLevel")
.forEach(button => {

    button.onclick = () => {

        raceLevel =
            button.dataset.level;

        startRace();

    };

});

document.getElementById("raceAgain")
    .onclick = () => startRace();

document.getElementById("raceMenuBtn")
    .onclick = () => {

        crashScreen.style.display = "none";
        raceMenu.style.display = "block";

    };

document.getElementById("racePause")
    .onclick = () => {

        if(!raceRunning) return;

        racePaused = !racePaused;

        document.getElementById("racePause")
            .textContent =
            racePaused ? "RESUME" : "PAUSE";

    };

window.addEventListener("keydown", e => {

    raceKeys[e.key.toLowerCase()] = true;

});

window.addEventListener("keyup", e => {

    raceKeys[e.key.toLowerCase()] = false;

});

function startRace(){

    raceMenu.style.display = "none";
    crashScreen.style.display = "none";

    raceRunning = true;
    racePaused = false;

    raceStartTime = performance.now();
    raceLastTime = performance.now();

    raceSpawnTimer = 0;

    raceEnemies = [];

    racePlayer = {
        x:300,
        y:590,
        width:48,
        height:85
    };

    document.getElementById("racePause")
        .textContent = "PAUSE";

    cancelAnimationFrame(raceAnimation);

    raceLoop();

}

function stopRace(){

    raceRunning = false;

    cancelAnimationFrame(raceAnimation);

}

function raceLoop(){

    if(!raceRunning) return;

    raceAnimation =
        requestAnimationFrame(raceLoop);

    let now = performance.now();

    let delta =
        Math.min((now-raceLastTime)/1000,.05);

    raceLastTime = now;

    if(racePaused){

        drawRace();

        return;

    }

    const settings =
        raceSettings[raceLevel];

    if(raceKeys["arrowleft"] ||
       raceKeys["a"]){

        racePlayer.x -=
            settings.speed * delta;

    }

    if(raceKeys["arrowright"] ||
       raceKeys["d"]){

        racePlayer.x +=
            settings.speed * delta;

    }

    racePlayer.x =
        Math.max(
            190,
            Math.min(
                362,
                racePlayer.x
            )
        );

    raceSpawnTimer -= delta;

    if(
        raceSpawnTimer <= 0 &&
        raceEnemies.length <
        settings.maxEnemies
    ){

        spawnRaceEnemy();

        raceSpawnTimer =
            0.7 + Math.random()*1.1;

    }

    for(let enemy of raceEnemies){

        enemy.y +=
            (settings.enemySpeed +
            enemy.extraSpeed) * delta;

    }

    raceEnemies =
        raceEnemies.filter(e =>
            e.y < 800
        );

    for(let enemy of raceEnemies){

        if(
            racePlayer.x <
                enemy.x + enemy.width &&
            racePlayer.x +
                racePlayer.width >
                enemy.x &&
            racePlayer.y <
                enemy.y + enemy.height &&
            racePlayer.y +
                racePlayer.height >
                enemy.y
        ){

            crashRace();

            return;

        }

    }

    let elapsed =
        Math.floor(
            (now-raceStartTime)/1000
        );

    document.getElementById("raceTime")
        .textContent = elapsed;

    document.getElementById("raceScore")
        .textContent = elapsed;

    drawRace();

}

function spawnRaceEnemy(){

    const lanes = [205,276,347];

    const x =
        lanes[
            Math.floor(
                Math.random()*lanes.length
            )
        ];

    const colors = [
        "#2196f3",
        "#ffeb3b",
        "#9c27b0",
        "#ff9800",
        "#00bcd4",
        "#ffffff"
    ];

    raceEnemies.push({

        x:x,
        y:-100,
        width:48,
        height:85,

        color:
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ],

        extraSpeed:
            Math.random()*80

    });

}

function drawRace(){

    rctx.clearRect(
        0,0,
        raceCanvas.width,
        raceCanvas.height
    );

    rctx.fillStyle="#3b3b3b";

    rctx.fillRect(
        0,0,
        600,700
    );

    /* road */

    rctx.fillStyle="#222";

    rctx.fillRect(
        170,0,
        260,700
    );

    /* road edges */

    rctx.fillStyle="#ffffff";

    rctx.fillRect(
        170,0,
        7,700
    );

    rctx.fillRect(
        423,0,
        7,700
    );

    /* lane markings */

    let offset =
        (performance.now()/5)%80;

    rctx.strokeStyle="#eeeeee";
    rctx.lineWidth=5;

    for(let y=-80+offset;y<700;y+=80){

        rctx.beginPath();

        rctx.moveTo(256,y);
        rctx.lineTo(256,y+40);

        rctx.stroke();

        rctx.beginPath();

        rctx.moveTo(343,y);
        rctx.lineTo(343,y+40);

        rctx.stroke();

    }

    /* enemies */

    for(let e of raceEnemies){

        drawCar(
            rctx,
            e.x,
            e.y,
            e.width,
            e.height,
            e.color
        );

    }

    /* player */

    drawCar(
        rctx,
        racePlayer.x,
        racePlayer.y,
        racePlayer.width,
        racePlayer.height,
        "#e53935"
    );

}

function drawCar(
    ctx,
    x,y,w,h,color
){

    ctx.fillStyle="#111";

    ctx.fillRect(
        x-5,
        y+15,
        8,
        22
    );

    ctx.fillRect(
        x+w-3,
        y+15,
        8,
        22
    );

    ctx.fillRect(
        x-5,
        y+h-37,
        8,
        22
    );

    ctx.fillRect(
        x+w-3,
        y+h-37,
        8,
        22
    );

    ctx.fillStyle=color;

    ctx.fillRect(
        x,
        y,
        w,
        h
    );

    ctx.fillStyle="#9ee7ff";

    ctx.fillRect(
        x+8,
        y+10,
        w-16,
        25
    );

    ctx.fillStyle="#222";

    ctx.fillRect(
        x+8,
        y+h-30,
        w-16,
        20
    );

    ctx.fillStyle="#fff";

    ctx.fillRect(
        x+6,
        y+3,
        10,
        6
    );

    ctx.fillRect(
        x+w-16,
        y+3,
        10,
        6
    );

}

function crashRace(){

    raceRunning = false;

    const score =
        document.getElementById("raceScore")
            .textContent;

    document.getElementById("finalScore")
        .textContent = score;

    crashScreen.style.display =
        "flex";

}


/* =========================================================
   GEOMETRY DASH
========================================================= */

const geoCanvas =
    document.getElementById("geoCanvas");

const gctx =
    geoCanvas.getContext("2d");

const geoMenu =
    document.getElementById("geoMenu");

let geoRunning = false;
let geoPaused = false;
let geoAnimation;

let currentLevel = 1;

let geoPlayer;
let geoCamera = 0;

let geoLastTime = 0;

let geoSpeed = 320;

let geoObstacles = [];

let geoGround = 500;

function resizeGeo(){

    geoCanvas.width =
        window.innerWidth;

    geoCanvas.height =
        window.innerHeight;

    geoGround =
        geoCanvas.height - 100;

}

window.addEventListener(
    "resize",
    resizeGeo
);

resizeGeo();

for(let i=1;i<=10;i++){

    const button =
        document.createElement("button");

    button.className =
        "levelButton";

    button.textContent =
        "LEVEL "+i;

    button.onclick = () =>
        startGeometry(i);

    document.getElementById("levelGrid")
        .appendChild(button);

}

document.getElementById("geoPause")
    .onclick = () => {

        geoPaused = !geoPaused;

        document.getElementById("geoPause")
            .textContent =
            geoPaused ? "RESUME" : "PAUSE";

    };

function startGeometry(level){

    currentLevel = level;

    geoMenu.style.display = "none";

    geoRunning = true;
    geoPaused = false;

    geoSpeed =
        280 + level*18;

    geoPlayer = {

        worldX:150,
        y:0,
        size:42,
        velocityY:0,
        grounded:true

    };

    geoCamera = 0;

    createGeoObstacles(level);

    document.getElementById("geoLevel")
        .textContent = level;

    geoLastTime =
        performance.now();

    cancelAnimationFrame(
        geoAnimation
    );

    geometryLoop();

}

function stopGeometry(){

    geoRunning = false;

    cancelAnimationFrame(
        geoAnimation
    );

}

function createGeoObstacles(level){

    geoObstacles = [];

    let x = 650;

    const count =
        15 + level*4;

    for(let i=0;i<count;i++){

        x +=
            300 +
            Math.random()*220 -
            level*5;

        const type =
            Math.random() < .65
            ? "spike"
            : "block";

        geoObstacles.push({

            x:x,
            type:type,
            width:
                type==="spike"
                ? 45
                : 55,
            height:
                type==="spike"
                ? 55
                : 70

        });

    }
}

function geometryLoop(){

    if(!geoRunning) return;

    geoAnimation =
        requestAnimationFrame(
            geometryLoop
        );

    let now =
        performance.now();

    let delta =
        Math.min(
            (now-geoLastTime)/1000,
            .04
        );

    geoLastTime = now;

    if(geoPaused){

        drawGeometry();

        return;

    }

    geoPlayer.worldX +=
        geoSpeed * delta;

    geoPlayer.velocityY +=
        1800 * delta;

    geoPlayer.y +=
        geoPlayer.velocityY * delta;

    if(
        geoPlayer.y >= 0
    ){

        geoPlayer.y = 0;

        geoPlayer.velocityY = 0;

        geoPlayer.grounded = true;

    }

    if(
        geoPlayer.worldX >
        geoCamera + 650
    ){

        geoCamera =
            geoPlayer.worldX - 650;

    }

    if(checkGeoCollision()){

        /* NO GAME OVER.
           Restart current level. */

        startGeometry(
            currentLevel
        );

        return;

    }

    const last =
        geoObstacles[
            geoObstacles.length-1
        ];

    if(
        last &&
        geoPlayer.worldX >
        last.x + 500
    ){

        if(currentLevel < 10){

            startGeometry(
                currentLevel+1
            );

        }
        else{

            geoMenu.style.display =
                "block";

            geoRunning = false;

        }

        return;

    }

    drawGeometry();

}

function jumpGeometry(){

    if(
        geoRunning &&
        !geoPaused &&
        geoPlayer.grounded
    ){

        geoPlayer.velocityY =
            -720;

        geoPlayer.grounded =
            false;

    }

}

geoCanvas.addEventListener(
    "pointerdown",
    jumpGeometry
);

window.addEventListener(
    "keydown",
    e => {

        if(
            e.code==="Space" ||
            e.code==="ArrowUp" ||
            e.code==="KeyW"
        ){

            if(
                screens.geo.classList.contains(
                    "active"
                )
            ){

                jumpGeometry();

            }

        }

    }
);

function checkGeoCollision(){

    const px =
        geoPlayer.worldX;

    const py =
        geoGround -
        geoPlayer.size -
        geoPlayer.y;

    for(let o of geoObstacles){

        const ox =
            o.x - geoCamera;

        const screenPlayerX =
            geoPlayer.worldX -
            geoCamera;

        if(
            screenPlayerX + geoPlayer.size - 7 >
                ox &&
            screenPlayerX + 7 <
                ox + o.width
        ){

            if(
                o.type==="spike"
            ){

                const spikeTop =
                    geoGround -
                    o.height;

                if(
                    py + geoPlayer.size >
                        spikeTop + 15
                ){

                    return true;

                }

            }
            else{

                const blockTop =
                    geoGround -
                    o.height;

                if(
                    py + geoPlayer.size >
                        blockTop
                ){

                    return true;

                }

            }

        }

    }

    return false;

}

function drawGeometry(){

    gctx.clearRect(
        0,0,
        geoCanvas.width,
        geoCanvas.height
    );

    /* sky */

    gctx.fillStyle="#45b8e8";

    gctx.fillRect(
        0,0,
        geoCanvas.width,
        geoCanvas.height
    );

    /* background */

    gctx.fillStyle="#6ed0ef";

    for(
        let x=
            -((geoCamera*.2)%100);
        x<geoCanvas.width;
        x+=100
    ){

        gctx.fillRect(
            x,
            150,
            50,
            80
        );

    }

    /* ground */

    gctx.fillStyle="#222";

    gctx.fillRect(
        0,
        geoGround,
        geoCanvas.width,
        geoCanvas.height -
        geoGround
    );

    gctx.fillStyle="#00e5ff";

    gctx.fillRect(
        0,
        geoGround,
        geoCanvas.width,
        8
    );

    /* obstacles */

    for(let o of geoObstacles){

        const x =
            o.x - geoCamera;

        if(
            x < -100 ||
            x > geoCanvas.width+100
        ) continue;

        if(
            o.type==="spike"
        ){

            gctx.fillStyle="#ff1744";

            gctx.beginPath();

            gctx.moveTo(
                x,
                geoGround
            );

            gctx.lineTo(
                x+o.width/2,
                geoGround-o.height
            );

            gctx.lineTo(
                x+o.width,
                geoGround
            );

            gctx.closePath();

            gctx.fill();

        }
        else{

            gctx.fillStyle="#9c27b0";

            gctx.fillRect(
                x,
                geoGround-o.height,
                o.width,
                o.height
            );

        }

    }

    /* player */

    const playerX =
        geoPlayer.worldX -
        geoCamera;

    const playerY =
        geoGround -
        geoPlayer.size -
        geoPlayer.y;

    gctx.save();

    gctx.translate(
        playerX+
        geoPlayer.size/2,
        playerY+
        geoPlayer.size/2
    );

    gctx.rotate(
        geoPlayer.worldX/100
    );

    gctx.fillStyle="#00e676";

    gctx.fillRect(
        -geoPlayer.size/2,
        -geoPlayer.size/2,
        geoPlayer.size,
        geoPlayer.size
    );

    gctx.fillStyle="#111";

    gctx.fillRect(
        -12,
        -10,
        7,
        7
    );

    gctx.fillRect(
        5,
        -10,
        7,
        7
    );

    gctx.restore();

}


/* =========================================================
   MINECRAFT
========================================================= */

const mineCanvas =
    document.getElementById("mineCanvas");

const mctx =
    mineCanvas.getContext("2d");

let mineRunning = false;

let mineScene;
let mineCamera;
let mineRenderer;

let minePlayer;

let mineWorld = [];

let mineKeys = {};

let mineYaw = 0;
let minePitch = 0;

let mineVelocityY = 0;
let mineCanJump = false;

let mineTouchLooking = false;
let mineLastX = 0;
let mineLastY = 0;

let mineSelected = 1;

const mineBlockNames = {
    1:"Grass",
    2:"Dirt",
    3:"Stone",
    4:"Wood",
    5:"Leaves"
};

const mineColors = {
    1:0x55aa44,
    2:0x8b5a2b,
    3:0x888888,
    4:0x9b6b35,
    5:0x238b45
};

let mineMaterials = {};

for(let id in mineColors){

    mineMaterials[id] =
        new THREE.MeshLambertMaterial({
            color:mineColors[id]
        });

}

function startMinecraft(){

    if(mineRunning) return;

    mineRunning = true;

    if(!mineScene){

        createMinecraft();

    }

}

function stopMinecraft(){

    mineRunning = false;

}

function createMinecraft(){

    mineScene =
        new THREE.Scene();

    mineScene.background =
        new THREE.Color(0x87ceeb);

    mineScene.fog =
        new THREE.Fog(
            0x87ceeb,
            25,
            65
        );

    mineCamera =
        new THREE.PerspectiveCamera(
            75,
            window.innerWidth/
            window.innerHeight,
            .1,
            200
        );

    mineRenderer =
        new THREE.WebGLRenderer({
            antialias:false
        });

    mineRenderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    mineRenderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    mineCanvas.replaceWith(
        mineRenderer.domElement
    );

    mineCanvas =
        mineRenderer.domElement;

    mineCanvas.id =
        "mineCanvas";

    const light =
        new THREE.HemisphereLight(
            0xffffff,
            0x557755,
            1.5
        );

    mineScene.add(light);

    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            1.2
        );

    sun.position.set(
        20,40,10
    );

    mineScene.add(sun);

    createMineWorld();

    minePlayer =
        new THREE.Object3D();

    minePlayer.position.set(
        0,
        getMineGround(0,0)+1.0,
        0
    );

    mineScene.add(
        minePlayer
    );

    minePlayer.add(
        mineCamera
    );

    mineCamera.position.set(
        0,.6,0
    );

    setupMineControls();

    window.addEventListener(
        "resize",
        resizeMinecraft
    );

    mineLoop();

}

function createMineWorld(){

    const size = 32;
    const half = 16;

    for(
        let x=-half;
        x<=half;
        x++
    ){

        for(
            let z=-half;
            z<=half;
            z++
        ){

            let h =
                2 +
                Math.floor(
                    Math.sin(x*.5)+
                    Math.cos(z*.45)+
                    Math.sin((x+z)*.25)
                );

            h =
                Math.max(
                    1,
                    Math.min(5,h)
                );

            for(
                let y=0;
                y<=h;
                y++
            ){

                let type;

                if(y===h)
                    type=1;
                else if(y>=h-2)
                    type=2;
                else
                    type=3;

                addMineBlock(
                    x,y,z,type
                );

            }

            if(
                Math.random()<.045 &&
                Math.abs(x)>2 &&
                Math.abs(z)>2
            ){

                createMineTree(
                    x,h+1,z
                );

            }

        }

    }

}

function addMineBlock(
    x,y,z,type
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1,1,1
            ),
            mineMaterials[type]
        );

    mesh.position.set(
        x,y,z
    );

    mesh.userData.block = true;
    mesh.userData.type = type;

    mineScene.add(mesh);

    mineWorld.push(mesh);

    return mesh;

}

function createMineTree(
    x,y,z
){

    for(
        let i=0;
        i<4;
        i++
    ){

        addMineBlock(
            x,
            y+i,
            z,
            4
        );

    }

    for(
        let dx=-2;
        dx<=2;
        dx++
    ){

        for(
            let dz=-2;
            dz<=2;
            dz++
        ){

            for(
                let dy=2;
                dy<=4;
                dy++
            ){

                if(
                    Math.abs(dx)+
                    Math.abs(dz)<=3
                ){

                    addMineBlock(
                        x+dx,
                        y+dy,
                        z+dz,
                        5
                    );

                }

            }

        }

    }

}

function getMineGround(
    x,z
){

    let highest=-1;

    for(
        let block of mineWorld
    ){

        if(
            Math.abs(
                block.position.x-x
            )<.5 &&
            Math.abs(
                block.position.z-z
            )<.5
        ){

            highest =
                Math.max(
                    highest,
                    block.position.y+.5
                );

        }

    }

    return highest;

}

function setupMineControls(){

    window.addEventListener(
        "keydown",
        e => {

            mineKeys[e.code]=true;

            if(
                e.code==="Space" ||
                e.code==="ArrowUp"
            ){

                mineJump();

            }

            if(
                e.code==="Digit1"
            ) mineSelect(1);

            if(
                e.code==="Digit2"
            ) mineSelect(2);

            if(
                e.code==="Digit3"
            ) mineSelect(3);

            if(
                e.code==="Digit4"
            ) mineSelect(4);

            if(
                e.code==="Digit5"
            ) mineSelect(5);

        }
    );

    window.addEventListener(
        "keyup",
        e => {
            mineKeys[e.code]=false;
        }
    );

    mineCanvas.addEventListener(
        "click",
        () => {

            if(
                window.innerWidth>=800
            ){

                mineCanvas.requestPointerLock();

            }

        }
    );

    document.addEventListener(
        "mousemove",
        e => {

            if(
                document.pointerLockElement===
                mineCanvas &&
                mineRunning
            ){

                mineYaw -=
                    e.movementX*.002;

                minePitch -=
                    e.movementY*.002;

                minePitch =
                    Math.max(
                        -1.45,
                        Math.min(
                            1.45,
                            minePitch
                        )
                    );

            }

        }
    );

    document.addEventListener(
        "mousedown",
        e => {

            if(!mineRunning) return;

            if(
                e.button===0
            ){

                breakMineBlock();

            }

            if(
                e.button===2
            ){

                placeMineBlock();

            }

        }
    );

    document.addEventListener(
        "contextmenu",
        e => {

            if(mineRunning)
                e.preventDefault();

        }
    );

    setupMobileMineButton(
        "mw","KeyW"
    );

    setupMobileMineButton(
        "ms","KeyS"
    );

    setupMobileMineButton(
        "ma","KeyA"
    );

    setupMobileMineButton(
        "md","KeyD"
    );

    document.getElementById("mj")
        .addEventListener(
            "touchstart",
            e => {

                e.preventDefault();

                mineJump();

            },
            {passive:false}
        );

    document.getElementById("mbreak")
        .addEventListener(
            "touchstart",
            e => {

                e.preventDefault();

                breakMineBlock();

            },
            {passive:false}
        );

    document.getElementById("mplace")
        .addEventListener(
            "touchstart",
            e => {

                e.preventDefault();

                placeMineBlock();

            },
            {passive:false}
        );

    mineCanvas.addEventListener(
        "touchstart",
        e => {

            if(e.touches.length!==1)
                return;

            mineTouchLooking=true;

            mineLastX =
                e.touches[0].clientX;

            mineLastY =
                e.touches[0].clientY;

        },
        {passive:false}
    );

    mineCanvas.addEventListener(
        "touchmove",
        e => {

            if(!mineTouchLooking)
                return;

            if(e.touches.length!==1)
                return;

            e.preventDefault();

            const x =
                e.touches[0].clientX;

            const y =
                e.touches[0].clientY;

            const dx =
                x-mineLastX;

            const dy =
                y-mineLastY;

            mineYaw -= dx*.006;

            minePitch -= dy*.006;

            minePitch =
                Math.max(
                    -1.45,
                    Math.min(
                        1.45,
                        minePitch
                    )
                );

            mineLastX=x;
            mineLastY=y;

        },
        {passive:false}
    );

    mineCanvas.addEventListener(
        "touchend",
        () => {
            mineTouchLooking=false;
        }
    );

}

function setupMobileMineButton(
    id,key
){

    const button =
        document.getElementById(id);

    button.addEventListener(
        "touchstart",
        e => {

            e.preventDefault();

            mineKeys[key]=true;

        },
        {passive:false}
    );

    button.addEventListener(
        "touchend",
        e => {

            e.preventDefault();

            mineKeys[key]=false;

        },
        {passive:false}
    );

    button.addEventListener(
        "touchcancel",
        () => {

            mineKeys[key]=false;

        }
    );

}

function mineSelect(type){

    mineSelected=type;

    document.getElementById(
        "selectedBlock"
    ).textContent =
        mineBlockNames[type];

}

function mineJump(){

    if(
        mineRunning &&
        mineCanJump
    ){

        mineVelocityY=8.5;

        mineCanJump=false;

    }

}

function updateMinecraft(
    delta
){

    const speed=5.5;

    let forward=0;
    let side=0;

    if(
        mineKeys["KeyW"] ||
        mineKeys["ArrowUp"]
    ) forward++;

    if(
        mineKeys["KeyS"] ||
        mineKeys["ArrowDown"]
    ) forward--;

    if(
        mineKeys["KeyA"] ||
        mineKeys["ArrowLeft"]
    ) side--;

    if(
        mineKeys["KeyD"] ||
        mineKeys["ArrowRight"]
    ) side++;

    const direction =
        new THREE.Vector3();

    if(
        forward!==0 ||
        side!==0
    ){

        direction.set(
            side,
            0,
            -forward
        );

        direction.normalize();

        direction.applyAxisAngle(
            new THREE.Vector3(0,1,0),
            mineYaw
        );

        const nx =
            minePlayer.position.x+
            direction.x*
            speed*delta;

        const nz =
            minePlayer.position.z+
            direction.z*
            speed*delta;

        if(
            !mineCollides(
                nx,
                minePlayer.position.y,
                minePlayer.position.z
            )
        ){

            minePlayer.position.x=nx;

        }

        if(
            !mineCollides(
                minePlayer.position.x,
                minePlayer.position.y,
                nz
            )
        ){

            minePlayer.position.z=nz;

        }

    }

    mineVelocityY -=
        22*delta;

    let ny =
        minePlayer.position.y+
        mineVelocityY*delta;

    const ground =
        getMineGround(
            minePlayer.position.x,
            minePlayer.position.z
        )+1;

    if(ny<=ground){

        ny=ground;

        mineVelocityY=0;

        mineCanJump=true;

    }
    else{

        mineCanJump=false;

    }

    minePlayer.position.y=ny;

    mineCamera.rotation.order=
        "YXZ";

    mineCamera.rotation.y=
        mineYaw;

    mineCamera.rotation.x=
        minePitch;

}

function mineCollides(
    x,y,z
){

    const r=.28;
    const h=1.8;

    for(
        let block of mineWorld
    ){

        const bx=block.position.x;
        const by=block.position.y;
        const bz=block.position.z;

        if(
            x+r>bx-.5 &&
            x-r<bx+.5 &&
            y+h/2>by-.5 &&
            y-h/2<by+.5 &&
            z+r>bz-.5 &&
            z-r<bz+.5
        ){

            return true;

        }

    }

    return false;

}

function getMineTarget(){

    const raycaster =
        new THREE.Raycaster();

    raycaster.setFromCamera(
        new THREE.Vector2(0,0),
        mineCamera
    );

    const hits =
        raycaster.intersectObjects(
            mineWorld
        );

    if(
        hits.length===0
    ) return null;

    if(
        hits[0].distance>7
    ) return null;

    return hits[0];

}

function breakMineBlock(){

    const hit =
        getMineTarget();

    if(!hit) return;

    const block =
        hit.object;

    if(
        block.position.y<=0
    ) return;

    mineScene.remove(block);

    const index =
        mineWorld.indexOf(block);

    if(index!==-1)
        mineWorld.splice(index,1);

}

function placeMineBlock(){

    const hit =
        getMineTarget();

    if(!hit) return;

    const normal =
        hit.face.normal.clone();

    normal.transformDirection(
        hit.object.matrixWorld
    );

    const position =
        hit.object.position.clone()
        .add(normal);

    const x =
        Math.round(position.x);

    const y =
        Math.round(position.y);

    const z =
        Math.round(position.z);

    if(
        mineCollides(
            x,
            y+0.9,
            z
        )
    ) return;

    addMineBlock(
        x,y,z,
        mineSelected
    );

}

function resizeMinecraft(){

    if(!mineCamera ||
       !mineRenderer)
        return;

    mineCamera.aspect =
        window.innerWidth/
        window.innerHeight;

    mineCamera.updateProjectionMatrix();

    mineRenderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}

let mineLastTime =
    performance.now();

function mineLoop(){

    if(!mineRunning)
        return;

    requestAnimationFrame(
        mineLoop
    );

    const now =
        performance.now();

    let delta =
        Math.min(
            (now-mineLastTime)/1000,
            .05
        );

    mineLastTime=now;

    updateMinecraft(delta);

    mineRenderer.render(
        mineScene,
        mineCamera
    );

}


/* =========================================================
   RESET MINECRAFT WHEN ENTERING AGAIN
========================================================= */

document.getElementById("mineHome")
    .addEventListener(
        "click",
        () => {

            mineRunning=false;

        }
    );

</script>
