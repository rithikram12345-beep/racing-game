<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing Game + Geometry Dash</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow-x: hidden;
}

h1 {
    margin: 20px 0 8px;
    font-size: 42px;
}

#app {
    width: 100%;
    max-width: 1100px;
    margin: auto;
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

.menu-box {
    margin: 40px auto;
    padding: 30px;
    max-width: 700px;
    background: #222;
    border-radius: 20px;
    border: 2px solid #555;
}

button {
    border: none;
    border-radius: 12px;
    padding: 15px 25px;
    margin: 8px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    background: #3498db;
    color: white;
}

button:hover {
    transform: scale(1.05);
    background: #2980b9;
}

.gameCanvas {
    display: block;
    margin: 15px auto;
    border: 4px solid white;
    border-radius: 10px;
    max-width: 95vw;
    background: #222;
}

.info {
    font-size: 20px;
    margin: 10px;
}

.small {
    font-size: 15px;
    color: #bbb;
}

.level-button {
    width: 130px;
    height: 60px;
}

.easy {
    background: #27ae60;
}

.medium {
    background: #f39c12;
}

.hard {
    background: #e74c3c;
}

.game-title {
    font-size: 32px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div id="app">

    <!-- HOME -->
    <div id="homeScreen" class="screen active">
        <div class="menu-box">
            <h1>MY GAMES</h1>
            <p class="info">Choose a game</p>

            <button onclick="openRacingMenu()">🏎️ RACING GAME</button>
            <button onclick="openGeometryMenu()">🎮 GEOMETRY DASH</button>
        </div>
    </div>


    <!-- RACING MENU -->
    <div id="racingMenu" class="screen">
        <div class="menu-box">
            <h1>RACING GAME</h1>

            <p class="info">Choose difficulty</p>

            <button class="easy" onclick="startRacing('easy')">EASY</button>
            <button class="medium" onclick="startRacing('medium')">MEDIUM</button>
            <button class="hard" onclick="startRacing('hard')">HARD</button>

            <br>

            <button onclick="goHome()">HOME</button>
        </div>
    </div>


    <!-- RACING GAME -->
    <div id="racingScreen" class="screen">

        <div class="game-title">🏎️ RACING GAME</div>

        <div class="info">
            TIME: <span id="raceTime">0</span>s
        </div>

        <canvas id="raceCanvas"
                class="gameCanvas"
                width="600"
                height="700"></canvas>

        <button onclick="pauseRacing()">PAUSE</button>
        <button onclick="goHome()">HOME</button>

        <p class="small">
            Move with LEFT / RIGHT or A / D
        </p>
    </div>


    <!-- GEOMETRY DASH MENU -->
    <div id="geometryMenu" class="screen">

        <div class="menu-box">

            <h1>GEOMETRY DASH</h1>

            <p class="info">Choose a level</p>

            <div id="levelButtons"></div>

            <br>

            <button onclick="goHome()">HOME</button>

        </div>

    </div>


    <!-- GEOMETRY DASH GAME -->
    <div id="geometryScreen" class="screen">

        <div class="game-title">🎮 GEOMETRY DASH</div>

        <div class="info">
            TIME: <span id="geoTime">0</span>s
        </div>

        <canvas id="geoCanvas"
                class="gameCanvas"
                width="1000"
                height="600"></canvas>

        <button onclick="pauseGeometry()">PAUSE</button>
        <button onclick="openGeometryMenu()">LEVELS</button>
        <button onclick="goHome()">HOME</button>

        <p class="small">
            SPACE / UP / W / CLICK = JUMP
        </p>

    </div>

</div>


<script>

/* =========================================================
   GENERAL SCREEN SYSTEM
========================================================= */

const screens = [
    "homeScreen",
    "racingMenu",
    "racingScreen",
    "geometryMenu",
    "geometryScreen"
];

function showScreen(id) {

    screens.forEach(function(screen) {
        document.getElementById(screen).classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
}

function goHome() {

    stopRacing();
    stopGeometry();

    showScreen("homeScreen");
}


/* =========================================================
   RACING GAME
========================================================= */

const raceCanvas = document.getElementById("raceCanvas");
const raceCtx = raceCanvas.getContext("2d");

let racing = false;
let racePaused = false;
let raceDifficulty = "easy";

let playerX = 270;
let playerY = 590;

let raceStartTime = 0;
let raceElapsed = 0;

let roadOffset = 0;

let raceKeys = {};

let enemyCars = [];

let spawnTimer = 0;

let raceAnimation;


/* PLAYER */

const playerCar = {
    width: 60,
    height: 100
};


/* DIFFICULTIES */

const raceSettings = {

    easy: {
        speed: 4,
        spawnRate: 110,
        maxCars: 2
    },

    medium: {
        speed: 5,
        spawnRate: 85,
        maxCars: 3
    },

    hard: {
        speed: 7,
        spawnRate: 60,
        maxCars: 4
    }

};


/* OPEN RACING MENU */

function openRacingMenu() {

    stopGeometry();
    stopRacing();

    showScreen("racingMenu");
}


/* START RACING */

function startRacing(difficulty) {

    raceDifficulty = difficulty;

    playerX = 270;
    playerY = 590;

    enemyCars = [];

    spawnTimer = 0;

    raceElapsed = 0;

    raceStartTime = performance.now();

    racePaused = false;
    racing = true;

    showScreen("racingScreen");

    requestAnimationFrame(racingLoop);
}


/* STOP */

function stopRacing() {

    racing = false;
    racePaused = false;

    if (raceAnimation) {
        cancelAnimationFrame(raceAnimation);
    }
}


/* PAUSE */

function pauseRacing() {

    if (!racing) return;

    racePaused = !racePaused;

    if (!racePaused) {
        raceStartTime = performance.now() - raceElapsed * 1000;
        requestAnimationFrame(racingLoop);
    }
}


/* KEYBOARD */

document.addEventListener("keydown", function(e) {

    raceKeys[e.key.toLowerCase()] = true;

    if (
        e.key === "ArrowLeft" ||
        e.key === "ArrowRight" ||
        e.key === " "
    ) {
        e.preventDefault();
    }

});

document.addEventListener("keyup", function(e) {

    raceKeys[e.key.toLowerCase()] = false;

});


/* SPAWN ENEMY */

function spawnEnemy() {

    const settings = raceSettings[raceDifficulty];

    if (enemyCars.length >= settings.maxCars) {
        return;
    }

    const lanes = [165, 270, 375];

    const lane = lanes[Math.floor(Math.random() * lanes.length)];

    const colors = [
        "#e74c3c",
        "#3498db",
        "#f1c40f",
        "#2ecc71",
        "#9b59b6",
        "#e67e22"
    ];

    const color =
        colors[Math.floor(Math.random() * colors.length)];

    enemyCars.push({
        x: lane,
        y: -120,
        width: 60,
        height: 100,
        speed: settings.speed * (0.8 + Math.random() * 0.5),
        color: color
    });
}


/* DRAW ROAD */

function drawRaceRoad() {

    raceCtx.fillStyle = "#202020";
    raceCtx.fillRect(0, 0, 600, 700);

    /* grass */

    raceCtx.fillStyle = "#16823b";

    raceCtx.fillRect(0, 0, 100, 700);
    raceCtx.fillRect(500, 0, 100, 700);

    /* road */

    raceCtx.fillStyle = "#333";

    raceCtx.fillRect(100, 0, 400, 700);

    /* road edges */

    raceCtx.fillStyle = "#fff";

    raceCtx.fillRect(100, 0, 6, 700);
    raceCtx.fillRect(494, 0, 6, 700);

    /* lane markings */

    raceCtx.fillStyle = "#fff";

    for (let y = -60; y < 700; y += 120) {

        raceCtx.fillRect(
            198,
            y + roadOffset,
            7,
            60
        );

        raceCtx.fillRect(
            396,
            y + roadOffset,
            7,
            60
        );
    }
}


/* DRAW CAR */

function drawRaceCar(x, y, color, isPlayer) {

    raceCtx.fillStyle = color;

    raceCtx.fillRect(
        x,
        y,
        60,
        100
    );

    /* roof */

    raceCtx.fillStyle =
        isPlayer ? "#eeeeee" : "#222";

    raceCtx.fillRect(
        x + 10,
        y + 18,
        40,
        40
    );

    /* windows */

    raceCtx.fillStyle = "#111";

    raceCtx.fillRect(
        x + 15,
        y + 23,
        30,
        14
    );

    raceCtx.fillRect(
        x + 15,
        y + 42,
        30,
        10
    );

    /* wheels */

    raceCtx.fillStyle = "#050505";

    raceCtx.fillRect(
        x - 7,
        y + 15,
        7,
        25
    );

    raceCtx.fillRect(
        x + 60,
        y + 15,
        7,
        25
    );

    raceCtx.fillRect(
        x - 7,
        y + 65,
        7,
        25
    );

    raceCtx.fillRect(
        x + 60,
        y + 65,
        7,
        25
    );

    /* headlights */

    raceCtx.fillStyle = "#fff";

    raceCtx.fillRect(
        x + 8,
        y + 5,
        12,
        8
    );

    raceCtx.fillRect(
        x + 40,
        y + 5,
        12,
        8
    );
}


/* COLLISION */

function raceCollision(a, b) {

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}


/* CRASH */

function raceCrash() {

    racing = false;

    drawRaceGameOver();

}


/* GAME OVER SCREEN */

function drawRaceGameOver() {

    raceCtx.fillStyle =
        "rgba(0,0,0,0.75)";

    raceCtx.fillRect(
        0,
        0,
        600,
        700
    );

    raceCtx.fillStyle = "#ff3333";

    raceCtx.font =
        "bold 50px Arial";

    raceCtx.textAlign = "center";

    raceCtx.fillText(
        "CRASH!",
        300,
        270
    );

    raceCtx.fillStyle = "#fff";

    raceCtx.font =
        "bold 25px Arial";

    raceCtx.fillText(
        "TIME: " +
        Math.floor(raceElapsed) +
        "s",
        300,
        320
    );

    raceCtx.fillText(
        "Press ENTER to play again",
        300,
        390
    );

    raceCtx.fillText(
        "Press M for menu",
        300,
        430
    );
}


/* ENTER / MENU */

document.addEventListener("keydown", function(e) {

    if (e.key === "Enter" && !racing &&
        document.getElementById("racingScreen").classList.contains("active")) {

        startRacing(raceDifficulty);
    }

    if (e.key.toLowerCase() === "m" &&
        !racing &&
        document.getElementById("racingScreen").classList.contains("active")) {

        openRacingMenu();
    }

});


/* RACING LOOP */

function racingLoop(now) {

    if (!racing) return;

    raceAnimation =
        requestAnimationFrame(racingLoop);

    if (racePaused) {

        drawRaceRoad();

        enemyCars.forEach(function(car) {

            drawRaceCar(
                car.x,
                car.y,
                car.color,
                false
            );

        });

        drawRaceCar(
            playerX,
            playerY,
            "#00e5ff",
            true
        );

        raceCtx.fillStyle =
            "rgba(0,0,0,0.7)";

        raceCtx.fillRect(
            0,
            0,
            600,
            700
        );

        raceCtx.fillStyle = "#fff";

        raceCtx.font =
            "bold 50px Arial";

        raceCtx.textAlign = "center";

        raceCtx.fillText(
            "PAUSED",
            300,
            330
        );

        return;
    }


    const settings =
        raceSettings[raceDifficulty];


    raceElapsed =
        (now - raceStartTime) / 1000;

    document.getElementById("raceTime").textContent =
        Math.floor(raceElapsed);


    /* PLAYER */

    if (raceKeys["arrowleft"] ||
        raceKeys["a"]) {

        playerX -= 7;
    }

    if (raceKeys["arrowright"] ||
        raceKeys["d"]) {

        playerX += 7;
    }


    if (playerX < 110) {
        playerX = 110;
    }

    if (playerX > 430) {
        playerX = 430;
    }


    /* ROAD */

    roadOffset += settings.speed;

    if (roadOffset > 120) {
        roadOffset -= 120;
    }


    /* SPAWN */

    spawnTimer++;

    if (spawnTimer >= settings.spawnRate) {

        spawnEnemy();

        spawnTimer = 0;
    }


    /* ENEMIES */

    enemyCars.forEach(function(car) {

        car.y += car.speed;

    });


    enemyCars =
        enemyCars.filter(function(car) {

            return car.y < 750;

        });


    /* COLLISION */

    const player = {
        x: playerX,
        y: playerY,
        width: 60,
        height: 100
    };


    for (let car of enemyCars) {

        if (raceCollision(player, car)) {

            raceCrash();
            return;
        }
    }


    /* DRAW */

    drawRaceRoad();


    enemyCars.forEach(function(car) {

        drawRaceCar(
            car.x,
            car.y,
            car.color,
            false
        );

    });


    drawRaceCar(
        playerX,
        playerY,
        "#00e5ff",
        true
    );

}


/* =========================================================
   GEOMETRY DASH
========================================================= */

const geoCanvas =
    document.getElementById("geoCanvas");

const geoCtx =
    geoCanvas.getContext("2d");


const GEO_WIDTH = 1000;
const GEO_HEIGHT = 600;
const GROUND = 500;


let geometryRunning = false;
let geometryPaused = false;

let currentLevel = 1;

let geoPlayer = {
    x: 150,
    y: 430,
    size: 45,
    velocityY: 0,
    onGround: true
};

let geoSpeed = 6;

let geoCamera = 0;

let geoStartTime = 0;
let geoElapsed = 0;

let geoObstacles = [];

let geoParticles = [];

let geoAnimation;


/* LEVEL SETTINGS */

const levels = [

    {
        speed: 5.5,
        obstacles: [
            [650, "spike"],
            [900, "spike"],
            [1150, "block"],
            [1450, "spike"],
            [1700, "spike"]
        ]
    },

    {
        speed: 6,
        obstacles: [
            [550, "spike"],
            [750, "spike"],
            [1000, "block"],
            [1250, "spike"],
            [1500, "spike"],
            [1800, "block"]
        ]
    },

    {
        speed: 6.5,
        obstacles: [
            [500, "spike"],
            [700, "spike"],
            [900, "spike"],
            [1150, "block"],
            [1400, "spike"],
            [1650, "spike"],
            [1900, "block"]
        ]
    },

    {
        speed: 7,
        obstacles: [
            [500, "spike"],
            [650, "spike"],
            [850, "block"],
            [1050, "spike"],
            [1250, "spike"],
            [1450, "block"],
            [1650, "spike"],
            [1850, "spike"]
        ]
    },

    {
        speed: 7.5,
        obstacles: [
            [500, "spike"],
            [650, "spike"],
            [800, "spike"],
            [1000, "block"],
            [1200, "spike"],
            [1400, "spike"],
            [1600, "block"],
            [1800, "spike"],
            [2000, "spike"]
        ]
    },

    {
        speed: 8,
        obstacles: [
            [500, "spike"],
            [620, "spike"],
            [740, "spike"],
            [900, "block"],
            [1100, "spike"],
            [1250, "spike"],
            [1450, "block"],
            [1650, "spike"],
            [1780, "spike"],
            [1950, "block"]
        ]
    },

    {
        speed: 8.5,
        obstacles: [
            [480, "spike"],
            [600, "spike"],
            [720, "spike"],
            [850, "spike"],
            [1050, "block"],
            [1250, "spike"],
            [1370, "spike"],
            [1550, "block"],
            [1750, "spike"],
            [1900, "spike"],
            [2050, "block"]
        ]
    },

    {
        speed: 9,
        obstacles: [
            [450, "spike"],
            [560, "spike"],
            [670, "spike"],
            [780, "spike"],
            [950, "block"],
            [1150, "spike"],
            [1260, "spike"],
            [1450, "block"],
            [1650, "spike"],
            [1760, "spike"],
            [1880, "spike"],
            [2050, "block"]
        ]
    },

    {
        speed: 9.5,
        obstacles: [
            [450, "spike"],
            [550, "spike"],
            [650, "spike"],
            [750, "spike"],
            [900, "block"],
            [1080, "spike"],
            [1180, "spike"],
            [1280, "spike"],
            [1450, "block"],
            [1630, "spike"],
            [1730, "spike"],
            [1830, "spike"],
            [2000, "block"]
        ]
    },

    {
        speed: 10,
        obstacles: [
            [430, "spike"],
            [530, "spike"],
            [630, "spike"],
            [730, "spike"],
            [830, "spike"],
            [1000, "block"],
            [1170, "spike"],
            [1270, "spike"],
            [1370, "spike"],
            [1500, "block"],
            [1670, "spike"],
            [1770, "spike"],
            [1870, "spike"],
            [2050, "block"],
            [2250, "spike"]
        ]
    }

];


/* LEVEL BUTTONS */

function createLevelButtons() {

    const container =
        document.getElementById("levelButtons");

    container.innerHTML = "";

    for (let i = 1; i <= 10; i++) {

        const button =
            document.createElement("button");

        button.className =
            "level-button";

        button.textContent =
            "LEVEL " + i;

        button.onclick =
            function() {
                startGeometry(i);
            };

        container.appendChild(button);
    }
}

createLevelButtons();


/* OPEN LEVEL MENU */

function openGeometryMenu() {

    stopGeometry();
    stopRacing();

    showScreen("geometryMenu");
}


/* START GEOMETRY */

function startGeometry(levelNumber) {

    currentLevel = levelNumber;

    const settings =
        levels[currentLevel - 1];

    geoSpeed =
        settings.speed;

    geoPlayer.x = 150;
    geoPlayer.y = 430;
    geoPlayer.velocityY = 0;
    geoPlayer.onGround = true;

    geoCamera = 0;

    geoElapsed = 0;

    geoStartTime =
        performance.now();

    geoParticles = [];

    geoObstacles =
        settings.obstacles.map(function(item) {

            return {
                x: item[0],
                type: item[1]
            };

        });

    geometryRunning = true;
    geometryPaused = false;

    showScreen("geometryScreen");

    requestAnimationFrame(geometryLoop);
}


/* STOP */

function stopGeometry() {

    geometryRunning = false;
    geometryPaused = false;

    if (geoAnimation) {

        cancelAnimationFrame(
            geoAnimation
        );
    }
}


/* JUMP */

function geoJump() {

    if (!geometryRunning) return;

    if (geometryPaused) return;

    if (geoPlayer.onGround) {

        geoPlayer.velocityY = -15;

        geoPlayer.onGround = false;

        createJumpParticles();
    }
}


/* KEYBOARD */

document.addEventListener("keydown", function(e) {

    if (
        e.code === "Space" ||
        e.key === "ArrowUp" ||
        e.key.toLowerCase() === "w"
    ) {

        if (
            document
                .getElementById("geometryScreen")
                .classList
                .contains("active")
        ) {

            e.preventDefault();

            geoJump();
        }
    }

    if (
        e.key === "Escape" &&
        geometryRunning
    ) {

        pauseGeometry();
    }

});


/* CLICK JUMP */

geoCanvas.addEventListener(
    "mousedown",
    function() {

        geoJump();

    }
);


/* PARTICLES */

function createJumpParticles() {

    for (let i = 0; i < 10; i++) {

        geoParticles.push({

            x:
                geoPlayer.x +
                geoPlayer.size / 2,

            y:
                geoPlayer.y +
                geoPlayer.size,

            vx:
                (Math.random() - 0.5) * 5,

            vy:
                Math.random() * 3,

            life: 30

        });
    }
}


function createRunParticles() {

    if (Math.random() > 0.35) return;

    geoParticles.push({

        x: geoPlayer.x + 5,

        y: geoPlayer.y +
            geoPlayer.size,

        vx:
            -Math.random() * 2,

        vy:
            (Math.random() - 0.5),

        life: 20

    });
}


function updateGeoParticles() {

    geoParticles.forEach(function(p) {

        p.x += p.vx;

        p.y += p.vy;

        p.vy += 0.15;

        p.life--;

    });

    geoParticles =
        geoParticles.filter(
            function(p) {
                return p.life > 0;
            }
        );
}


function drawGeoParticles() {

    geoParticles.forEach(function(p) {

        geoCtx.fillStyle =
            "rgba(255,255,255," +
            p.life / 30 +
            ")";

        geoCtx.fillRect(
            p.x - geoCamera,
            p.y,
            6,
            6
        );

    });
}


/* DRAW PLAYER */

function drawGeoPlayer() {

    const x =
        geoPlayer.x -
        geoCamera;

    const y =
        geoPlayer.y;

    geoCtx.save();

    geoCtx.translate(
        x + geoPlayer.size / 2,
        y + geoPlayer.size / 2
    );

    geoCtx.rotate(
        geoPlayer.velocityY * 0.025
    );

    geoCtx.fillStyle =
        "#00e5ff";

    geoCtx.fillRect(
        -geoPlayer.size / 2,
        -geoPlayer.size / 2,
        geoPlayer.size,
        geoPlayer.size
    );

    geoCtx.fillStyle =
        "#111";

    geoCtx.fillRect(
        -10,
        -10,
        7,
        7
    );

    geoCtx.fillRect(
        4,
        -10,
        7,
        7
    );

    geoCtx.fillRect(
        -9,
        5,
        20,
        5
    );

    geoCtx.restore();
}


/* DRAW SPIKE */

function drawGeoSpike(x) {

    x -= geoCamera;

    geoCtx.fillStyle =
        "#ff3333";

    geoCtx.beginPath();

    geoCtx.moveTo(
        x,
        GROUND
    );

    geoCtx.lineTo(
        x + 25,
        GROUND - 50
    );

    geoCtx.lineTo(
        x + 50,
        GROUND
    );

    geoCtx.closePath();

    geoCtx.fill();
}


/* DRAW BLOCK */

function drawGeoBlock(x) {

    x -= geoCamera;

    geoCtx.fillStyle =
        "#9b59b6";

    geoCtx.fillRect(
        x,
        GROUND - 50,
        55,
        50
    );

    geoCtx.strokeStyle =
        "#fff";

    geoCtx.lineWidth = 3;

    geoCtx.strokeRect(
        x,
        GROUND - 50,
        55,
        50
    );
}


/* COLLISION */

function geoCollision() {

    const px =
        geoPlayer.x;

    const py =
        geoPlayer.y;

    const ps =
        geoPlayer.size;

    for (let obstacle of geoObstacles) {

        if (
            obstacle.x >
            px + ps + 50 ||

            obstacle.x + 60 <
            px - 50
        ) {

            continue;
        }

        if (
            obstacle.type === "spike"
        ) {

            const sx =
                obstacle.x;

            const sy =
                GROUND - 50;

            if (
                px + ps > sx + 8 &&
                px < sx + 42 &&
                py + ps > sy + 10 &&
                py < GROUND
            ) {

                return true;
            }

        } else {

            const bx =
                obstacle.x;

            const by =
                GROUND - 50;

            if (
                px + ps > bx &&
                px < bx + 55 &&
                py + ps > by &&
                py < GROUND
            ) {

                return true;
            }
        }
    }

    return false;
}


/* CRASH */

function geometryCrash() {

    geoPlayer.velocityY = -8;

    geoPlayer.onGround = false;

    createJumpParticles();

    setTimeout(function() {

        if (geometryRunning) {

            startGeometry(currentLevel);

        }

    }, 300);
}


/* FINISH LINE */

function drawFinishLine() {

    const finishX =
        geoObstacles.length > 0
        ? geoObstacles[geoObstacles.length - 1].x + 300
        : 2500;

    const screenX =
        finishX - geoCamera;

    if (
        screenX > -100 &&
        screenX < GEO_WIDTH + 100
    ) {

        geoCtx.fillStyle =
            "#fff";

        geoCtx.fillRect(
            screenX,
            250,
            10,
            250
        );

        const squareSize = 20;

        for (
            let row = 0;
            row < 8;
            row++
        ) {

            for (
                let col = 0;
                col < 2;
                col++
            ) {

                if (
                    (row + col) % 2 === 0
                ) {

                    geoCtx.fillStyle =
                        "#111";

                } else {

                    geoCtx.fillStyle =
                        "#fff";
                }

                geoCtx.fillRect(
                    screenX +
                    10 +
                    col * squareSize,

                    250 +
                    row * squareSize,

                    squareSize,
                    squareSize
                );
            }
        }

        geoCtx.fillStyle =
            "#fff";

        geoCtx.font =
            "bold 24px Arial";

        geoCtx.fillText(
            "FINISH",
            screenX - 20,
            230
        );
    }
}


/* GEOMETRY BACKGROUND */

function drawGeometryBackground() {

    geoCtx.fillStyle =
        "#161625";

    geoCtx.fillRect(
        0,
        0,
        GEO_WIDTH,
        GEO_HEIGHT
    );

    /* background lines */

    geoCtx.strokeStyle =
        "#292945";

    geoCtx.lineWidth = 2;

    for (
        let x = -geoCamera % 50;
        x < GEO_WIDTH;
        x += 50
    ) {

        geoCtx.beginPath();

        geoCtx.moveTo(
            x,
            0
        );

        geoCtx.lineTo(
            x,
            GROUND
        );

        geoCtx.stroke();
    }

    /* ground */

    geoCtx.fillStyle =
        "#222";

    geoCtx.fillRect(
        0,
        GROUND,
        GEO_WIDTH,
        GEO_HEIGHT - GROUND
    );

    geoCtx.fillStyle =
        "#00e5ff";

    geoCtx.fillRect(
        0,
        GROUND,
        GEO_WIDTH,
        5
    );
}


/* GEOMETRY GAME LOOP */

function geometryLoop(now) {

    if (!geometryRunning) return;

    geoAnimation =
        requestAnimationFrame(
            geometryLoop
        );


    if (geometryPaused) {

        drawGeometryGame();

        drawPauseOverlay();

        return;
    }


    geoElapsed =
        (now - geoStartTime) / 1000;

    document.getElementById("geoTime")
        .textContent =
        Math.floor(geoElapsed);


    /* PHYSICS */

    geoPlayer.velocityY += 0.8;

    geoPlayer.y +=
        geoPlayer.velocityY;


    if (
        geoPlayer.y +
        geoPlayer.size >=
        GROUND
    ) {

        geoPlayer.y =
            GROUND -
            geoPlayer.size;

        geoPlayer.velocityY = 0;

        geoPlayer.onGround = true;

        createRunParticles();

    }


    /* CAMERA */

    geoCamera +=
        geoSpeed;


    /* PARTICLES */

    updateGeoParticles();


    /* COLLISION */

    if (geoCollision()) {

        geometryCrash();

        return;
    }


    /* FINISH */

    const finishX =
        geoObstacles[
            geoObstacles.length - 1
        ].x + 300;

    if (
        geoPlayer.x >=
        finishX
    ) {

        geometryComplete();

        return;
    }


    drawGeometryGame();
}


/* DRAW GAME */

function drawGeometryGame() {

    drawGeometryBackground();

    drawFinishLine();

    geoObstacles.forEach(
        function(obstacle) {

            if (
                obstacle.type === "spike"
            ) {

                drawGeoSpike(
                    obstacle.x
                );

            } else {

                drawGeoBlock(
                    obstacle.x
                );
            }
        }
    );

    drawGeoParticles();

    drawGeoPlayer();

    /* level */

    geoCtx.fillStyle =
        "#fff";

    geoCtx.font =
        "bold 22px Arial";

    geoCtx.textAlign =
        "left";

    geoCtx.fillText(
        "LEVEL " + currentLevel,
        20,
        35
    );
}


/* PAUSE */

function pauseGeometry() {

    if (!geometryRunning) return;

    geometryPaused =
        !geometryPaused;

    if (!geometryPaused) {

        geoStartTime =
            performance.now() -
            geoElapsed * 1000;

        requestAnimationFrame(
            geometryLoop
        );
    }
}


/* PAUSE SCREEN */

function drawPauseOverlay() {

    geoCtx.fillStyle =
        "rgba(0,0,0,0.65)";

    geoCtx.fillRect(
        0,
        0,
        GEO_WIDTH,
        GEO_HEIGHT
    );

    geoCtx.fillStyle =
        "#fff";

    geoCtx.font =
        "bold 60px Arial";

    geoCtx.textAlign =
        "center";

    geoCtx.fillText(
        "PAUSED",
        GEO_WIDTH / 2,
        280
    );

    geoCtx.font =
        "25px Arial";

    geoCtx.fillText(
        "Press PAUSE again to continue",
        GEO_WIDTH / 2,
        330
    );
}


/* COMPLETE */

function geometryComplete() {

    geometryRunning = false;

    drawGeometryGame();

    geoCtx.fillStyle =
        "rgba(0,0,0,0.7)";

    geoCtx.fillRect(
        0,
        0,
        GEO_WIDTH,
        GEO_HEIGHT
    );

    geoCtx.fillStyle =
        "#00ff88";

    geoCtx.font =
        "bold 60px Arial";

    geoCtx.textAlign =
        "center";

    geoCtx.fillText(
        "LEVEL COMPLETE!",
        GEO_WIDTH / 2,
        250
    );

    geoCtx.fillStyle =
        "#fff";

    geoCtx.font =
        "bold 30px Arial";

    geoCtx.fillText(
        "Time: " +
        Math.floor(geoElapsed) +
        " seconds",
        GEO_WIDTH / 2,
        310
    );

    geoCtx.font =
        "22px Arial";

    geoCtx.fillText(
        "Press ENTER for next level",
        GEO_WIDTH / 2,
        370
    );

    geoCtx.fillText(
        "Press L for levels",
        GEO_WIDTH / 2,
        410
    );
}


/* NEXT LEVEL */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "Enter" &&
            !geometryRunning &&
            document
                .getElementById("geometryScreen")
                .classList
                .contains("active")
        ) {

            if (currentLevel < 10) {

                startGeometry(
                    currentLevel + 1
                );

            } else {

                openGeometryMenu();
            }
        }


        if (
            e.key.toLowerCase() === "l" &&
            !geometryRunning &&
            document
                .getElementById("geometryScreen")
                .classList
                .contains("active")
        ) {

            openGeometryMenu();
        }

    }
);


/* =========================================================
   TOUCH / MOBILE SUPPORT
========================================================= */

let touchStartX = null;

raceCanvas.addEventListener(
    "touchstart",
    function(e) {

        touchStartX =
            e.touches[0].clientX;

    }
);

raceCanvas.addEventListener(
    "touchmove",
    function(e) {

        if (touchStartX === null)
            return;

        const x =
            e.touches[0].clientX;

        const difference =
            x - touchStartX;

        playerX +=
            difference * 0.1;

        if (playerX < 110)
            playerX = 110;

        if (playerX > 430)
            playerX = 430;

        touchStartX = x;

        e.preventDefault();

    },
    { passive: false }
);

raceCanvas.addEventListener(
    "touchend",
    function() {

        touchStartX = null;

    }
);


/* =========================================================
   START
========================================================= */

showScreen("homeScreen");

</script>
