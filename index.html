<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Games</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

.screen{
    display:none;
}

.screen.active{
    display:block;
}

.menu{
    max-width:750px;
    margin:50px auto;
    padding:35px;
    background:#222;
    border:2px solid #555;
    border-radius:20px;
}

h1{
    font-size:45px;
    margin:15px;
}

button{
    border:0;
    border-radius:12px;
    padding:14px 25px;
    margin:8px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    background:#3498db;
}

button:hover{
    transform:scale(1.05);
}

.easy{background:#27ae60}
.medium{background:#f39c12}
.hard{background:#e74c3c}

canvas{
    display:block;
    margin:15px auto;
    border:4px solid white;
    border-radius:10px;
    max-width:95vw;
}

.info{
    font-size:21px;
    margin:8px;
}

.small{
    color:#aaa;
}
</style>
</head>

<body>

<div id="home" class="screen active">
    <div class="menu">
        <h1>🎮 MY GAMES</h1>
        <p class="info">Choose a game</p>

        <button onclick="openRaceMenu()">🏎️ RACING GAME</button>
        <button onclick="openGeoMenu()">🎮 GEOMETRY DASH</button>
    </div>
</div>


<div id="raceMenu" class="screen">
    <div class="menu">
        <h1>🏎️ RACING GAME</h1>

        <p class="info">Choose difficulty</p>

        <button class="easy" onclick="startRace('easy')">EASY</button>
        <button class="medium" onclick="startRace('medium')">MEDIUM</button>
        <button class="hard" onclick="startRace('hard')">HARD</button>

        <br>

        <button onclick="goHome()">HOME</button>
    </div>
</div>


<div id="raceScreen" class="screen">

    <h1>🏎️ RACING GAME</h1>

    <div class="info">
        TIME: <span id="raceTime">0</span>s
        &nbsp;&nbsp;&nbsp;
        SCORE: <span id="raceScore">0</span>
    </div>

    <canvas id="raceCanvas" width="600" height="700"></canvas>

    <button onclick="toggleRacePause()">PAUSE</button>
    <button onclick="goHome()">HOME</button>

    <p class="small">
        Move with LEFT / RIGHT or A / D
    </p>
</div>


<div id="geoMenu" class="screen">

    <div class="menu">

        <h1>🎮 GEOMETRY DASH</h1>

        <p class="info">Choose a level</p>

        <div id="levels"></div>

        <br>

        <button onclick="goHome()">HOME</button>

    </div>

</div>


<div id="geoScreen" class="screen">

    <h1>🎮 GEOMETRY DASH</h1>

    <div class="info">
        TIME: <span id="geoTime">0</span>s
    </div>

    <canvas id="geoCanvas" width="1000" height="600"></canvas>

    <button onclick="toggleGeoPause()">PAUSE</button>
    <button onclick="openGeoMenu()">LEVELS</button>
    <button onclick="goHome()">HOME</button>

    <p class="small">
        SPACE / UP / W / CLICK = JUMP
    </p>

</div>


<script>

/* =========================================================
   SCREEN SYSTEM
========================================================= */

function showScreen(id){

    document.querySelectorAll(".screen").forEach(function(s){
        s.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
}


function goHome(){

    stopRace();
    stopGeo();

    showScreen("home");
}


/* =========================================================
   RACING GAME
========================================================= */

const raceCanvas =
    document.getElementById("raceCanvas");

const rc =
    raceCanvas.getContext("2d");

let raceRunning=false;
let racePaused=false;

let raceDifficulty="easy";

let playerX=270;
let playerY=580;

let raceEnemies=[];

let raceStart=0;
let raceElapsed=0;
let raceScore=0;

let roadOffset=0;
let spawnTimer=0;

let raceFrame;


const raceSettings={

    easy:{
        speed:4,
        spawn:100,
        max:2
    },

    medium:{
        speed:5,
        spawn:75,
        max:3
    },

    hard:{
        speed:7,
        spawn:50,
        max:4
    }

};


let raceKeys={};


document.addEventListener("keydown",function(e){

    raceKeys[e.key.toLowerCase()]=true;

    if(
        e.key==="ArrowLeft" ||
        e.key==="ArrowRight" ||
        e.key===" "
    ){
        e.preventDefault();
    }

});


document.addEventListener("keyup",function(e){

    raceKeys[e.key.toLowerCase()]=false;

});


function openRaceMenu(){

    stopRace();
    stopGeo();

    showScreen("raceMenu");
}


function startRace(difficulty){

    raceDifficulty=difficulty;

    playerX=270;
    playerY=580;

    raceEnemies=[];

    spawnTimer=0;

    raceElapsed=0;
    raceScore=0;

    document.getElementById("raceTime").textContent="0";
    document.getElementById("raceScore").textContent="0";

    raceStart=performance.now();

    raceRunning=true;
    racePaused=false;

    showScreen("raceScreen");

    cancelAnimationFrame(raceFrame);

    raceFrame=requestAnimationFrame(raceLoop);
}


function stopRace(){

    raceRunning=false;
    racePaused=false;

    cancelAnimationFrame(raceFrame);
}


function toggleRacePause(){

    if(!raceRunning)return;

    racePaused=!racePaused;

    if(!racePaused){

        raceStart=
            performance.now()-
            raceElapsed*1000;

        raceFrame=requestAnimationFrame(raceLoop);
    }
}


function spawnRaceEnemy(){

    let settings=raceSettings[raceDifficulty];

    if(raceEnemies.length>=settings.max)return;

    let lanes=[145,270,395];

    let lane=
        lanes[Math.floor(Math.random()*lanes.length)];

    let colors=[
        "#e74c3c",
        "#3498db",
        "#f1c40f",
        "#2ecc71",
        "#9b59b6",
        "#e67e22"
    ];

    let color=
        colors[Math.floor(Math.random()*colors.length)];

    raceEnemies.push({

        x:lane,
        y:-120,

        width:60,
        height:100,

        speed:
            settings.speed*
            (0.8+Math.random()*0.5),

        color:color
    });
}


function drawRoad(){

    rc.fillStyle="#16823b";
    rc.fillRect(0,0,600,700);

    rc.fillStyle="#333";
    rc.fillRect(100,0,400,700);

    rc.fillStyle="white";

    rc.fillRect(100,0,6,700);
    rc.fillRect(494,0,6,700);

    for(
        let y=-120;
        y<700;
        y+=120
    ){

        rc.fillRect(
            198,
            y+roadOffset,
            7,
            60
        );

        rc.fillRect(
            396,
            y+roadOffset,
            7,
            60
        );
    }
}


function drawCar(x,y,color,player){

    rc.fillStyle=color;

    rc.fillRect(
        x,
        y,
        60,
        100
    );

    rc.fillStyle=
        player ? "#ddd" : "#222";

    rc.fillRect(
        x+10,
        y+18,
        40,
        40
    );

    rc.fillStyle="#111";

    rc.fillRect(
        x+15,
        y+23,
        30,
        14
    );

    rc.fillRect(
        x+15,
        y+42,
        30,
        10
    );

    rc.fillStyle="#050505";

    rc.fillRect(x-7,y+15,7,25);
    rc.fillRect(x+60,y+15,7,25);

    rc.fillRect(x-7,y+65,7,25);
    rc.fillRect(x+60,y+65,7,25);

    rc.fillStyle="#fff";

    rc.fillRect(x+8,y+5,12,8);
    rc.fillRect(x+40,y+5,12,8);
}


function raceCollision(a,b){

    return(
        a.x<b.x+b.width &&
        a.x+a.width>b.x &&
        a.y<b.y+b.height &&
        a.y+a.height>b.y
    );
}


function raceGameOver(){

    raceRunning=false;

    drawRace();

    rc.fillStyle="rgba(0,0,0,.78)";
    rc.fillRect(0,0,600,700);

    rc.fillStyle="#ff3333";

    rc.font="bold 55px Arial";
    rc.textAlign="center";

    rc.fillText(
        "💥 CRASH!",
        300,
        250
    );

    rc.fillStyle="white";

    rc.font="bold 28px Arial";

    rc.fillText(
        "TIME: "+
        Math.floor(raceElapsed)+
        "s",
        300,
        310
    );

    rc.fillText(
        "SCORE: "+
        raceScore,
        300,
        350
    );

    rc.font="22px Arial";

    rc.fillText(
        "Press ENTER to play again",
        300,
        410
    );

    rc.fillText(
        "Press M for menu",
        300,
        450
    );
}


document.addEventListener("keydown",function(e){

    if(
        e.key==="Enter" &&
        !raceRunning &&
        document
        .getElementById("raceScreen")
        .classList.contains("active")
    ){

        startRace(raceDifficulty);
    }

    if(
        e.key.toLowerCase()==="m" &&
        !raceRunning &&
        document
        .getElementById("raceScreen")
        .classList.contains("active")
    ){

        openRaceMenu();
    }

});


function drawRace(){

    drawRoad();

    raceEnemies.forEach(function(car){

        drawCar(
            car.x,
            car.y,
            car.color,
            false
        );
    });

    drawCar(
        playerX,
        playerY,
        "#00e5ff",
        true
    );

    if(racePaused){

        rc.fillStyle="rgba(0,0,0,.7)";
        rc.fillRect(0,0,600,700);

        rc.fillStyle="white";

        rc.font="bold 55px Arial";
        rc.textAlign="center";

        rc.fillText(
            "PAUSED",
            300,
            340
        );
    }
}


function raceLoop(now){

    if(!raceRunning)return;

    raceFrame=
        requestAnimationFrame(raceLoop);

    if(racePaused){

        drawRace();
        return;
    }


    raceElapsed=
        (now-raceStart)/1000;

    /*
       SCORE = one point for every second
       survived.
    */

    raceScore=
        Math.floor(raceElapsed);


    document.getElementById("raceTime").textContent=
        Math.floor(raceElapsed);

    document.getElementById("raceScore").textContent=
        raceScore;


    let settings=
        raceSettings[raceDifficulty];


    if(
        raceKeys["arrowleft"] ||
        raceKeys["a"]
    ){

        playerX-=7;
    }


    if(
        raceKeys["arrowright"] ||
        raceKeys["d"]
    ){

        playerX+=7;
    }


    if(playerX<110)playerX=110;
    if(playerX>430)playerX=430;


    roadOffset+=settings.speed;

    if(roadOffset>120){
        roadOffset-=120;
    }


    spawnTimer++;

    if(spawnTimer>=settings.spawn){

        spawnRaceEnemy();

        spawnTimer=0;
    }


    raceEnemies.forEach(function(car){

        car.y+=car.speed;
    });


    raceEnemies=
        raceEnemies.filter(function(car){

            return car.y<750;
        });


    let player={

        x:playerX,
        y:playerY,
        width:60,
        height:100
    };


    for(let car of raceEnemies){

        if(raceCollision(player,car)){

            raceGameOver();
            return;
        }
    }


    drawRace();
}


/* =========================================================

========================================================= */

    document.getElementById("geoCanvas");

const gc=

const GW=1000;

const GROUND=500;


let geoRunning=false;
let geoPaused=false;

let geoLevel=1;

let geoFrame;

let geoStart=0;
let geoElapsed=0;

let geoSpeed=6;

*/

let particles=[];

/* LEVEL BUTTONS */

function createLevelButtons(){

    let box=
        document.getElementById("levels");

    box.innerHTML="";

    for(let i=1;i<=10;i++){

        let b=
            document.createElement("button");

        b.textContent=
            "LEVEL "+i;

        b.onclick=
            function(){
                startGeo(i);
            };

        box.appendChild(b);
    }
}

createLevelButtons();


function openGeoMenu(){

    stopGeo();
    stopRace();

    showScreen("geoMenu");
}


function startGeo(level){

    geoLevel=level;

    let settings=
        levelData[level-1];

    geoSpeed=
        settings.speed;

    playerWorldX=150;

    playerY=
        GROUND-playerSize;

    playerVelocity=0;

    playerOnGround=true;

    cameraX=0;

    geoElapsed=0;

    geoStart=
        performance.now();

    particles=[];

    geoObstacles=
        settings.obs.map(function(o){

            return{
                x:o[0],
                type:o[1]
            };
        });


    geoRunning=true;
    geoPaused=false;

    showScreen("geoScreen");

    cancelAnimationFrame(geoFrame);

    geoFrame=
        requestAnimationFrame(geoLoop);
}


function stopGeo(){

    geoRunning=false;
    geoPaused=false;

    cancelAnimationFrame(geoFrame);
}


/* JUMP */

function geoJump(){

    if(!geoRunning)return;
    if(geoPaused)return;

    if(playerOnGround){

        playerVelocity=-15;

        playerOnGround=false;

        jumpParticles();
    }
}


document.addEventListener("keydown",function(e){

    if(
        e.code==="Space" ||
        e.key==="ArrowUp" ||
        e.key.toLowerCase()==="w"
    ){

        if(
            document
            .getElementById("geoScreen")
            .classList.contains("active")
        ){

            e.preventDefault();

            geoJump();
        }
    }

    if(
        e.key==="Escape" &&
        geoRunning
    ){

        toggleGeoPause();
    }

});


geoCanvas.addEventListener(
    "mousedown",
    function(){
        geoJump();
    }
);


/* PARTICLES */

function jumpParticles(){

    for(let i=0;i<12;i++){

        particles.push({

            x:playerWorldX+
              playerSize/2,

            y:playerY+
              playerSize,

            vx:(Math.random()-.5)*5,

            vy:Math.random()*3,

            life:30
        });
    }
}


function runParticles(){

    if(Math.random()>.35)return;

    particles.push({

        x:playerWorldX,

        y:playerY+playerSize,

        vx:-2,

        vy:Math.random()-0.5,

        life:20
    });
}


function updateParticles(){

    particles.forEach(function(p){

        p.x+=p.vx;
        p.y+=p.vy;

        p.vy+=.15;

        p.life--;
    });

    particles=
        particles.filter(
            function(p){
                return p.life>0;
            }
        );
}


function drawParticles(){

    particles.forEach(function(p){

        let sx=
            p.x-cameraX;

        gc.fillStyle=
            "rgba(255,255,255,"+
            p.life/30+
            ")";

        gc.fillRect(
            sx,
            p.y,
            6,
            6
        );
    });
}


/* PLAYER */

function drawPlayer(){

    /*
       The player screen position changes
       while moving.

       Camera follows more slowly,
       making the forward movement visible.
    */

    let screenX=
        playerWorldX-cameraX;

    gc.save();

    gc.translate(
        screenX+playerSize/2,
        playerY+playerSize/2
    );

    gc.rotate(
        playerVelocity*.025
    );

    gc.fillStyle="#00e5ff";

    gc.fillRect(
        -playerSize/2,
        -playerSize/2,
        playerSize,
        playerSize
    );

    gc.fillStyle="#111";

    gc.fillRect(-10,-10,7,7);
    gc.fillRect(4,-10,7,7);

    gc.fillRect(-9,5,20,5);

    gc.restore();
}


/* SPIKE */

function drawSpike(worldX){

    let x=
        worldX-cameraX;

    gc.fillStyle="#ff3333";

    gc.beginPath();

    gc.moveTo(x,GROUND);

    gc.lineTo(
        x+25,
        GROUND-50
    );

    gc.lineTo(
        x+50,
        GROUND
    );

    gc.closePath();

    gc.fill();
}


/* BLOCK */

function drawBlock(worldX){

    let x=
        worldX-cameraX;

    gc.fillStyle="#9b59b6";

    gc.fillRect(
        x,
        GROUND-50,
        55,
        50
    );

    gc.strokeStyle="white";
    gc.lineWidth=3;

    gc.strokeRect(
        x,
        GROUND-50,
        55,
        50
    );
}


/* COLLISION */

function geoCollision(){

    let px=playerWorldX;
    let py=playerY;
    let s=playerSize;

    for(let o of geoObstacles){

        if(
            o.x>px+s+60 ||
            o.x+60<px-60
        ){

            continue;
        }


        if(o.type==="spike"){

            if(
                px+s>o.x+8 &&
                px<o.x+42 &&
                py+s>GROUND-45 &&
                py<GROUND
            ){

                return true;
            }

        }else{

            if(
                px+s>o.x &&
                px<o.x+55 &&
                py+s>GROUND-50 &&
                py<GROUND
            ){

                return true;
            }
        }
    }

    return false;
}


/* FINISH */

function getFinishX(){

    return(
        geoObstacles[
            geoObstacles.length-1
        ].x+300
    );
}


function drawFinish(){

    let finish=
        getFinishX();

    let x=
        finish-cameraX;

    if(
        x>-100 &&
        x<GW+100
    ){

        gc.fillStyle="white";

        gc.fillRect(
            x,
            250,
            10,
            250
        );


        let size=20;

        for(
            let row=0;
            row<8;
            row++
        ){

            for(
                let col=0;
                col<2;
                col++
            ){

                gc.fillStyle=
                    (row+col)%2===0
                    ? "#111"
                    : "#fff";

                gc.fillRect(
                    x+10+col*size,
                    250+row*size,
                    size,
                    size
                );
            }
        }


        gc.fillStyle="white";

        gc.font="bold 24px Arial";

        gc.textAlign="left";

        gc.fillText(
            "FINISH",
            x-20,
            230
        );
    }
}


/* BACKGROUND */

function drawGeoBackground(){

    gc.fillStyle="#161625";

    gc.fillRect(
        0,
        0,
        GW,
        GH
    );


    gc.strokeStyle="#292945";

    gc.lineWidth=2;


    /*
       Moving background grid.
    */

    let gridOffset=
        -(cameraX%50);

    for(
        let x=gridOffset;
        x<GW;
        x+=50
    ){

        gc.beginPath();

        gc.moveTo(x,0);
        gc.lineTo(x,GROUND);

        gc.stroke();
    }


    gc.fillStyle="#222";

    gc.fillRect(
        0,
        GROUND,
        GW,
        GH-GROUND
    );


    gc.fillStyle="#00e5ff";

    gc.fillRect(
        0,
        GROUND,
        GW,
        5
    );
}


/* DRAW GEOMETRY */

function drawGeo(){

    drawGeoBackground();

    drawFinish();


    geoObstacles.forEach(
        function(o){

            if(o.type==="spike"){

                drawSpike(o.x);

            }else{

                drawBlock(o.x);
            }
        }
    );


    drawParticles();

    drawPlayer();


    gc.fillStyle="white";

    gc.font="bold 22px Arial";

    gc.textAlign="left";

    gc.fillText(
        "LEVEL "+geoLevel,
        20,
        35
    );
}


/* CRASH */

function geoCrash(){

    geoRunning=false;

    drawGeo();

    gc.fillStyle=
        "rgba(0,0,0,.75)";

    gc.fillRect(
        0,
        0,
        GW,
        GH
    );

    gc.fillStyle="#ff3333";

    gc.font="bold 65px Arial";

    gc.textAlign="center";

    gc.fillText(
        "CRASH!",
        GW/2,
        260
    );

    gc.fillStyle="white";

    gc.font="25px Arial";

    gc.fillText(
        "Restarting...",
        GW/2,
        315
    );


    setTimeout(function(){

        if(
            document
            .getElementById("geoScreen")
            .classList.contains("active")
        ){

            startGeo(geoLevel);
        }

    },700);
}


/* COMPLETE */

function geoComplete(){

    geoRunning=false;

    drawGeo();

    gc.fillStyle=
        "rgba(0,0,0,.72)";

    gc.fillRect(
        0,
        0,
        GW,
        GH
    );

    gc.fillStyle="#00ff88";

    gc.font="bold 60px Arial";

    gc.textAlign="center";

    gc.fillText(
        "LEVEL COMPLETE!",
        GW/2,
        250
    );

    gc.fillStyle="white";

    gc.font="bold 30px Arial";

    gc.fillText(
        "Time: "+
        Math.floor(geoElapsed)+
        " seconds",
        GW/2,
        310
    );

    gc.font="22px Arial";

    if(geoLevel<10){

        gc.fillText(
            "Press ENTER for next level",
            GW/2,
            370
        );

    }else{

        gc.fillText(
            "YOU BEAT ALL 10 LEVELS!",
            GW/2,
            370
        );
    }

    gc.fillText(
        "Press L for levels",
        GW/2,
        410
    );
}


/* PAUSE */

function toggleGeoPause(){

    if(!geoRunning)return;

    geoPaused=!geoPaused;

    if(!geoPaused){

        geoStart=
            performance.now()-
            geoElapsed*1000;

        geoFrame=
            requestAnimationFrame(
                geoLoop
            );
    }
}


function drawGeoPause(){

    gc.fillStyle=
        "rgba(0,0,0,.7)";

    gc.fillRect(
        0,
        0,
        GW,
        GH
    );

    gc.fillStyle="white";

    gc.font="bold 60px Arial";

    gc.textAlign="center";

    gc.fillText(
        "PAUSED",
        GW/2,
        280
    );
}


/* MAIN GEOMETRY LOOP */

function geoLoop(now){

    if(!geoRunning)return;

    geoFrame=
        requestAnimationFrame(
            geoLoop
        );


    if(geoPaused){

        drawGeo();
        drawGeoPause();

        return;
    }


    geoElapsed=
        (now-geoStart)/1000;

    document.getElementById("geoTime").textContent=
        Math.floor(geoElapsed);


    /*
       REAL CHARACTER MOVEMENT

       The character's world position moves
       forward every frame.
    */

    playerWorldX+=geoSpeed;


    /* GRAVITY */

    playerVelocity+=.8;

    playerY+=playerVelocity;


    if(
        playerY+playerSize>=GROUND
    ){

        playerY=
            GROUND-playerSize;

        playerVelocity=0;

        playerOnGround=true;

        runParticles();

    }else{

        playerOnGround=false;
    }


    /*
       CAMERA FOLLOW

       Camera follows the player but does
       not completely lock the player.
       This makes the movement visible.
    */

    let targetCamera=
        playerWorldX-350;

    cameraX+=
        (targetCamera-cameraX)*.08;


    if(cameraX<0){
        cameraX=0;
    }


    updateParticles();


    if(geoCollision()){

        geoCrash();
        return;
    }


    if(
        playerWorldX>=getFinishX()
    ){

        geoComplete();
        return;
    }


    drawGeo();
}


/* NEXT LEVEL / LEVEL MENU */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key==="Enter" &&
            !geoRunning &&
            document
            .getElementById("geoScreen")
            .classList.contains("active")
        ){

            if(geoLevel<10){

                startGeo(geoLevel+1);

            }else{

                openGeoMenu();
            }
        }


        if(
            e.key.toLowerCase()==="l" &&
            !geoRunning &&
            document
            .getElementById("geoScreen")
            .classList.contains("active")
        ){

            openGeoMenu();
        }

    }
);


/* START */

showScreen("home");

</script>
