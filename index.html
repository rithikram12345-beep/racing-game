<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rithik Games</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 20px 0;
}

button {
    padding: 12px 25px;
    margin: 8px;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    background: #3498db;
    color: white;
}

button:hover {
    opacity: 0.8;
}

.screen {
    display: none;
}

.active {
    display: block;
}

canvas {
    display: block;
    margin: 15px auto;
    border: 3px solid white;
    max-width: 95vw;
}

.info {
    font-size: 20px;
    margin: 10px;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="homeScreen" class="screen active">
    <h1>rithik GAMES</h1>
    <button onclick="showRacingMenu()">Racing Game</button>
    <button onclick="showGeometryMenu()">Geometry Dash</button>
</div>


<!-- RACING MENU -->
<div id="racingMenu" class="screen">
    <h1>RACING GAME</h1>

    <p>Select Difficulty</p>

    <button onclick="startRacing('easy')">Easy</button>
    <button onclick="startRacing('medium')">Medium</button>
    <button onclick="startRacing('hard')">Hard</button>

    <br>

    <button onclick="goHome()">Home</button>
</div>


<!-- RACING GAME -->
<div id="racingGameScreen" class="screen">

    <h1>RACING GAME</h1>

    <div class="info">
        TIME: <span id="raceTime">0</span> seconds
        &nbsp;&nbsp;
        SCORE: <span id="raceScore">0</span>
    </div>

    <canvas id="raceCanvas" width="600" height="700"></canvas>

    <button onclick="pauseRace()">Pause</button>
    <button onclick="goHome()">Home</button>
</div>


<!-- GEOMETRY MENU -->
<div id="geometryMenu" class="screen">

    <h1>GEOMETRY DASH</h1>

    <p>Select Level</p>

    <div id="levelButtons"></div>

    <br>

    <button onclick="goHome()">Home</button>
</div>


<!-- GEOMETRY DASH -->
<div id="geometryGameScreen" class="screen">

    <h1>GEOMETRY DASH</h1>

    <div class="info">
        LEVEL: <span id="geoLevelText">1</span>
        &nbsp;&nbsp;
        TIME: <span id="geoTime">0</span> seconds
    </div>

    <canvas id="geoCanvas" width="1000" height="600"></canvas>

    <button onclick="pauseGeometry()">Pause</button>
    <button onclick="showGeometryMenu()">Levels</button>
    <button onclick="goHome()">Home</button>
</div>


<script>

/* =====================================================
   SCREEN SYSTEM
===================================================== */

function hideAllScreens() {
    document.querySelectorAll(".screen").forEach(function(screen) {
        screen.classList.remove("active");
    });
}

function goHome() {
    hideAllScreens();
    document.getElementById("homeScreen").classList.add("active");

    raceRunning = false;
    geoRunning = false;
}

function showRacingMenu() {
    hideAllScreens();
    document.getElementById("racingMenu").classList.add("active");

    raceRunning = false;
}

function showGeometryMenu() {
    hideAllScreens();
    document.getElementById("geometryMenu").classList.add("active");

    geoRunning = false;
}

function startGameScreen(id) {
    hideAllScreens();
    document.getElementById(id).classList.add("active");
}


/* =====================================================
   RACING GAME
===================================================== */

const raceCanvas = document.getElementById("raceCanvas");
const raceCtx = raceCanvas.getContext("2d");

let raceRunning = false;
let racePaused = false;
let raceGameOver = false;

let raceDifficulty = "easy";

let playerCar = {
    x: 275,
    y: 580,
    width: 50,
    height: 90,
    speed: 7
};

let enemyCars = [];

let raceStartTime = 0;
let raceElapsed = 0;

let lastEnemyTime = 0;
let raceAnimation;


function startRacing(difficulty) {

    raceDifficulty = difficulty;

    startGameScreen("racingGameScreen");

    raceRunning = true;
    racePaused = false;
    raceGameOver = false;

    playerCar.x = 275;

    enemyCars = [];

    raceStartTime = performance.now();
    raceElapsed = 0;

    lastEnemyTime = performance.now();

    document.getElementById("raceTime").textContent = "0";
    document.getElementById("raceScore").textContent = "0";

    if (difficulty === "easy") {
        playerCar.speed = 6;
    }

    if (difficulty === "medium") {
        playerCar.speed = 8;
    }

    if (difficulty === "hard") {
        playerCar.speed = 10;
    }

    cancelAnimationFrame(raceAnimation);

    raceLoop();
}


function drawRaceRoad() {

    raceCtx.fillStyle = "#168a35";
    raceCtx.fillRect(0, 0, 600, 700);

    raceCtx.fillStyle = "#333";
    raceCtx.fillRect(100, 0, 400, 700);

    raceCtx.fillStyle = "#fff";

    raceCtx.fillRect(95, 0, 5, 700);
    raceCtx.fillRect(500, 0, 5, 700);

    let offset = (performance.now() / 5) % 100;

    for (let y = -100; y < 700; y += 100) {
        raceCtx.fillRect(295, y + offset, 10, 55);
    }
}


function drawCar(car, color) {

    raceCtx.fillStyle = color;

    raceCtx.fillRect(
        car.x,
        car.y,
        car.width,
        car.height
    );

    raceCtx.fillStyle = "#111";

    raceCtx.fillRect(
        car.x + 8,
        car.y + 12,
        car.width - 16,
        25
    );

    raceCtx.fillStyle = "#222";

    raceCtx.fillRect(
        car.x - 7,
        car.y + 15,
        7,
        25
    );

    raceCtx.fillRect(
        car.x + car.width,
        car.y + 15,
        7,
        25
    );

    raceCtx.fillRect(
        car.x - 7,
        car.y + 60,
        7,
        25
    );

    raceCtx.fillRect(
        car.x + car.width,
        car.y + 60,
        7,
        25
    );
}


function createEnemy() {

    let colors = [
        "#3498db",
        "#f1c40f",
        "#9b59b6",
        "#2ecc71",
        "#e67e22",
        "#ffffff"
    ];

    let speed = 4;

    if (raceDifficulty === "easy") {
        speed = 3 + Math.random() * 2;
    }

    if (raceDifficulty === "medium") {
        speed = 4 + Math.random() * 3;
    }

    if (raceDifficulty === "hard") {
        speed = 6 + Math.random() * 4;
    }

    enemyCars.push({
        x: 120 + Math.random() * 330,
        y: -100,
        width: 50,
        height: 90,
        speed: speed,
        color: colors[
            Math.floor(Math.random() * colors.length)
        ]
    });
}


function rectanglesCollide(a, b) {

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}


function showRaceGameOver() {

    raceRunning = false;
    raceGameOver = true;

    raceCtx.fillStyle = "rgba(0,0,0,0.8)";
    raceCtx.fillRect(0, 0, 600, 700);

    raceCtx.fillStyle = "red";
    raceCtx.font = "bold 55px Arial";
    raceCtx.textAlign = "center";

    raceCtx.fillText(
        "CRASH!",
        300,
        280
    );

    raceCtx.fillStyle = "white";
    raceCtx.font = "bold 28px Arial";

    raceCtx.fillText(
        "Score: " + Math.floor(raceElapsed),
        300,
        330
    );

    raceCtx.font = "22px Arial";

    raceCtx.fillText(
        "Press R to play again",
        300,
        390
    );

    raceCtx.fillText(
        "Press M for menu",
        300,
        430
    );
}


function raceLoop() {

    if (!raceRunning) {
        return;
    }

    if (!racePaused) {

        raceElapsed =
            (performance.now() - raceStartTime) / 1000;

        document.getElementById("raceTime").textContent =
            Math.floor(raceElapsed);

        document.getElementById("raceScore").textContent =
            Math.floor(raceElapsed);

        drawRaceRoad();


        let enemyDelay = 1000;

        if (raceDifficulty === "medium") {
            enemyDelay = 800;
        }

        if (raceDifficulty === "hard") {
            enemyDelay = 600;
        }

        if (
            performance.now() - lastEnemyTime >
            enemyDelay
        ) {
            createEnemy();
            lastEnemyTime = performance.now();
        }


        for (let i = enemyCars.length - 1; i >= 0; i--) {

            let enemy = enemyCars[i];

            enemy.y += enemy.speed;

            drawCar(enemy, enemy.color);

            if (rectanglesCollide(playerCar, enemy)) {
                showRaceGameOver();
                return;
            }

            if (enemy.y > 750) {
                enemyCars.splice(i, 1);
            }
        }

        drawCar(playerCar, "#e74c3c");
    }

    raceAnimation =
        requestAnimationFrame(raceLoop);
}


function pauseRace() {

    if (!raceRunning) {
        return;
    }

    racePaused = !racePaused;
}


/* Racing controls */

document.addEventListener("keydown", function(event) {

    if (
        raceGameOver &&
        event.key.toLowerCase() === "r"
    ) {
        startRacing(raceDifficulty);
        return;
    }

    if (
        raceGameOver &&
        event.key.toLowerCase() === "m"
    ) {
        showRacingMenu();
        return;
    }

    if (!raceRunning || racePaused) {
        return;
    }

    if (
        event.key === "ArrowLeft" ||
        event.key.toLowerCase() === "a"
    ) {

        playerCar.x -= playerCar.speed;

        if (playerCar.x < 105) {
            playerCar.x = 105;
        }
    }

    if (
        event.key === "ArrowRight" ||
        event.key.toLowerCase() === "d"
    ) {

        playerCar.x += playerCar.speed;

        if (playerCar.x > 445) {
            playerCar.x = 445;
        }
    }
});


/* =====================================================
   GEOMETRY DASH
===================================================== */

const geoCanvas =
    document.getElementById("geoCanvas");

const geoCtx =
    geoCanvas.getContext("2d");

let geoRunning = false;
let geoPaused = false;

let currentLevel = 1;

let playerWorldX = 150;
let playerY = 500;

let playerVelocityY = 0;

let playerOnGround = true;

let cameraX = 0;

let geoSpeed = 6;

let geoStartTime = 0;
let geoElapsed = 0;

let geoAnimation;

let geoObstacles = [];

let geoFinishX = 3000;


/* Level data */

const levels = [

    {
        speed: 5,
        obstacles: [
            [500,500,50,100],
            [800,450,50,150],
            [1100,500,50,100],
            [1450,450,50,150],
            [1800,500,50,100],
            [2200,450,50,150]
        ]
    },

    {
        speed: 5.5,
        obstacles: [
            [450,500,50,100],
            [650,500,50,100],
            [900,420,50,180],
            [1200,500,50,100],
            [1500,450,50,150],
            [1800,400,50,200],
            [2150,500,50,100],
            [2500,450,50,150]
        ]
    },

    {
        speed: 6,
        obstacles: [
            [500,500,50,100],
            [700,450,50,150],
            [950,400,50,200],
            [1250,500,50,100],
            [1450,400,50,200],
            [1750,450,50,150],
            [2050,350,50,250],
            [2400,450,50,150]
        ]
    },

    {
        speed: 6.5,
        obstacles: [
            [450,450,50,150],
            [650,450,50,150],
            [850,400,50,200],
            [1100,350,50,250],
            [1400,450,50,150],
            [1600,400,50,200],
            [1900,350,50,250],
            [2250,400,50,200],
            [2550,450,50,150]
        ]
    },

    {
        speed: 7,
        obstacles: [
            [450,500,50,100],
            [600,450,50,150],
            [800,400,50,200],
            [1050,500,50,100],
            [1200,350,50,250],
            [1500,400,50,200],
            [1750,300,50,300],
            [2050,400,50,200],
            [2350,350,50,250],
            [2700,400,50,200]
        ]
    },

    {
        speed: 7.5,
        obstacles: [
            [450,400,50,200],
            [650,350,50,250],
            [900,450,50,150],
            [1100,300,50,300],
            [1400,400,50,200],
            [1650,350,50,250],
            [1900,300,50,300],
            [2200,400,50,200],
            [2500,350,50,250],
            [2850,400,50,200]
        ]
    },

    {
        speed: 8,
        obstacles: [
            [450,450,50,150],
            [600,350,50,250],
            [850,300,50,300],
            [1100,400,50,200],
            [1350,300,50,300],
            [1600,350,50,250],
            [1900,250,50,350],
            [2200,350,50,250],
            [2500,300,50,300],
            [2850,350,50,250]
        ]
    },

    {
        speed: 8.5,
        obstacles: [
            [450,400,50,200],
            [600,300,50,300],
            [850,350,50,250],
            [1050,250,50,350],
            [1350,350,50,250],
            [1550,300,50,300],
            [1800,250,50,350],
            [2100,350,50,250],
            [2350,300,50,300],
            [2650,250,50,350],
            [3000,350,50,250]
        ]
    },

    {
        speed: 9,
        obstacles: [
            [450,350,50,250],
            [650,250,50,350],
            [900,300,50,300],
            [1150,200,50,400],
            [1450,300,50,300],
            [1700,250,50,350],
            [2000,200,50,400],
            [2300,300,50,300],
            [2600,250,50,350],
            [2900,200,50,400]
        ]
    },

    {
        speed: 10,
        obstacles: [
            [450,300,50,300],
            [650,200,50,400],
            [900,250,50,350],
            [1150,150,50,450],
            [1450,250,50,350],
            [1700,200,50,400],
            [2000,150,50,450],
            [2300,250,50,350],
            [2600,200,50,400],
            [2900,150,50,450],
            [3250,250,50,350]
        ]
    }
];


/* Level buttons */

const levelButtons =
    document.getElementById("levelButtons");

for (let i = 1; i <= 10; i++) {

    let button =
        document.createElement("button");

    button.textContent =
        "Level " + i;

    button.onclick = function() {
        startGeometry(i);
    };

    levelButtons.appendChild(button);
}


/* Start Geometry Dash */

function startGeometry(level) {

    currentLevel = level;

    startGameScreen("geometryGameScreen");

    geoRunning = true;
    geoPaused = false;

    playerWorldX = 150;
    playerY = 500;

    playerVelocityY = 0;
    playerOnGround = true;

    /*
       CAMERA STARTS AT ZERO.
       The character will visibly move.
    */

    cameraX = 0;

    geoSpeed =
        levels[level - 1].speed;

    geoObstacles =
        levels[level - 1].obstacles;

    geoFinishX =
        geoObstacles[
            geoObstacles.length - 1
        ][0] + 350;

    geoStartTime =
        performance.now();

    geoElapsed = 0;

    document.getElementById(
        "geoLevelText"
    ).textContent = level;

    document.getElementById(
        "geoTime"
    ).textContent = "0";

    cancelAnimationFrame(geoAnimation);

    geometryLoop();
}


/* Draw background */

function drawGeometryBackground() {

    geoCtx.fillStyle = "#07152b";

    geoCtx.fillRect(
        0,
        0,
        1000,
        600
    );

    /*
       Background grid
    */

    geoCtx.fillStyle = "#10294d";

    for (
        let x = -100 - (cameraX % 100);
        x < 1100;
        x += 100
    ) {

        for (
            let y = 50;
            y < 450;
            y += 100
        ) {

            geoCtx.fillRect(
                x,
                y,
                60,
                60
            );
        }
    }

    /*
       Ground
    */

    geoCtx.fillStyle = "#222";

    geoCtx.fillRect(
        0,
        550,
        1000,
        50
    );

    geoCtx.fillStyle = "#00ff88";

    geoCtx.fillRect(
        0,
        550,
        1000,
        8
    );
}


/* Draw obstacles */

function drawGeometryObstacles() {

    for (let obstacle of geoObstacles) {

        let x =
            obstacle[0] - cameraX;

        let y =
            obstacle[1];

        let width =
            obstacle[2];

        let height =
            obstacle[3];

        if (
            x > -100 &&
            x < 1100
        ) {

            geoCtx.fillStyle = "#e74c3c";

            geoCtx.fillRect(
                x,
                y,
                width,
                height
            );

            geoCtx.fillStyle = "#ff7675";

            geoCtx.fillRect(
                x,
                y,
                width,
                8
            );

            geoCtx.strokeStyle = "white";

            geoCtx.lineWidth = 2;

            geoCtx.strokeRect(
                x,
                y,
                width,
                height
            );
        }
    }
}


/* Finish line */

function drawFinishLine() {

    let x =
        geoFinishX - cameraX;

    if (
        x > -100 &&
        x < 1100
    ) {

        geoCtx.fillStyle = "white";

        geoCtx.fillRect(
            x,
            100,
            8,
            450
        );

        geoCtx.fillStyle = "yellow";

        geoCtx.font =
            "bold 25px Arial";

        geoCtx.fillText(
            "FINISH",
            x - 35,
            90
        );
    }
}


/* Draw player */

function drawGeometryPlayer() {

    let screenX =
        playerWorldX - cameraX;

    let size = 50;

    geoCtx.save();

    geoCtx.translate(
        screenX + 25,
        playerY + 25
    );

    /*
       Rotate while jumping.
    */

    if (!playerOnGround) {
        geoCtx.rotate(
            playerWorldX * 0.08
        );
    }

    /*
       Character body
    */

    geoCtx.fillStyle = "#00ff88";

    geoCtx.fillRect(
        -25,
        -25,
        50,
        50
    );

    geoCtx.strokeStyle = "white";

    geoCtx.lineWidth = 3;

    geoCtx.strokeRect(
        -25,
        -25,
        50,
        50
    );

    /*
       Eyes
    */

    geoCtx.fillStyle = "#111";

    geoCtx.fillRect(
        -15,
        -10,
        10,
        10
    );

    geoCtx.fillRect(
        5,
        -10,
        10,
        10
    );

    /*
       Mouth
    */

    geoCtx.fillRect(
        -12,
        10,
        24,
        5
    );

    geoCtx.restore();

    /*
       Movement trail
    */

    geoCtx.fillStyle =
        "rgba(0,255,136,0.25)";

    geoCtx.fillRect(
        screenX - 35,
        playerY + 15,
        25,
        20
    );
}


/* Jump */

function geometryJump() {

    if (
        geoRunning &&
        !geoPaused &&
        playerOnGround
    ) {

        playerVelocityY = -15;

        playerOnGround = false;
    }
}


/* Keyboard */

document.addEventListener("keydown", function(event) {

    if (
        event.code === "Space" ||
        event.key === "ArrowUp" ||
        event.key.toLowerCase() === "w"
    ) {

        if (
            geoRunning &&
            !geoPaused
        ) {

            event.preventDefault();

            geometryJump();
        }
    }
});


/* Mouse */

geoCanvas.addEventListener(
    "mousedown",
    function() {

        geometryJump();
    }
);


/* =====================================================
   GEOMETRY COLLISION
===================================================== */

function geometryCollision() {

    let size = 50;

    let playerLeft =
        playerWorldX;

    let playerRight =
        playerWorldX + size;

    let playerTop =
        playerY;

    let playerBottom =
        playerY + size;


    for (let obstacle of geoObstacles) {

        let left =
            obstacle[0];

        let top =
            obstacle[1];

        let right =
            obstacle[0] + obstacle[2];

        let bottom =
            obstacle[1] + obstacle[3];


        if (
            playerRight > left &&
            playerLeft < right &&
            playerBottom > top &&
            playerTop < bottom
        ) {

            return true;
        }
    }

    return false;
}


/* =====================================================
   GEOMETRY LOOP
===================================================== */

function geometryLoop() {

    if (!geoRunning) {
        return;
    }

    if (!geoPaused) {

        /*
           TIME
        */

        geoElapsed =
            (performance.now() -
             geoStartTime) / 1000;

        document.getElementById(
            "geoTime"
        ).textContent =
            Math.floor(geoElapsed);


        /*
           ================================================
           CHARACTER MOVES FORWARD
           ================================================
        */

        playerWorldX += geoSpeed;


        /*
           Gravity
        */

        playerVelocityY += 0.7;

        playerY += playerVelocityY;


        /*
           Ground
        */

        if (playerY >= 500) {

            playerY = 500;

            playerVelocityY = 0;

            playerOnGround = true;
        }


        /*
           ================================================
           CAMERA
           ================================================

           Character starts at screen X = 150.

           It moves:

           150
           200
           300
           400
           500
           600
           650

           ONLY THEN does the camera start moving.
        */

        let screenX =
            playerWorldX - cameraX;

        const RIGHT_ZONE = 650;

        const LEFT_ZONE = 180;


        if (screenX > RIGHT_ZONE) {

            cameraX =
                playerWorldX -
                RIGHT_ZONE;
        }


        if (screenX < LEFT_ZONE) {

            cameraX =
                Math.max(
                    0,
                    playerWorldX -
                    LEFT_ZONE
                );
        }


        /*
           Draw
        */

        drawGeometryBackground();

        drawGeometryObstacles();

        drawFinishLine();

        drawGeometryPlayer();


        /*
           ================================================
           NO GAME OVER
           ================================================

           If the character hits an obstacle,
           the level simply restarts.

           There is NO "GAME OVER" screen.
        */

        if (geometryCollision()) {

            startGeometry(currentLevel);

            return;
        }


        /*
           Finish
        */

        if (
            playerWorldX >=
            geoFinishX
        ) {

            /*
               Automatically go to next level.
            */

            if (currentLevel < 10) {

                startGeometry(
                    currentLevel + 1
                );

            } else {

                /*
                   After level 10, return to
                   the level menu.
                */

                showGeometryMenu();
            }

            return;
        }
    }

    geoAnimation =
        requestAnimationFrame(
            geometryLoop
        );
}


/* Pause */

function pauseGeometry() {

    if (!geoRunning) {
        return;
    }

    geoPaused =
        !geoPaused;
}

</script>

</body>
</html>
